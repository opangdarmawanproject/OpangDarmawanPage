<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Pop Portfolio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Space+Mono:wght@700&display=swap');

        /* RESET & GLOBAL */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Space Mono', monospace; overflow-x: hidden; background-color: #111; color: #fff; transition: background 0.5s; }

        /* --- HALAMAN INTRO (PUZZLE PERMISI) --- */
        #intro-screen {
            position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 10%; z-index: 2000; background-color: #111;
        }
        #scatter-container { position: absolute; inset: 0; pointer-events: none; }
        .scattered-letter {
            position: absolute; font-family: 'Bangers', cursive; font-size: 5rem; cursor: pointer; pointer-events: auto; user-select: none;
            color: #ff00ff;
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #ff00ff, 0 0 40px #ff00ff;
            transition: transform 0.2s, text-shadow 0.2s;
        }
        .scattered-letter:hover { transform: scale(1.2); text-shadow: 0 0 10px #fff, 0 0 20px #00ffff, 0 0 40px #00ffff; color: #00ffff;}
        .shake { animation: shake 0.4s; color: red !important; text-shadow: 0 0 20px red !important; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        
        #slots-container { display: flex; gap: 15px; margin-bottom: 20px; z-index: 10; }
        .slot {
            width: 50px; height: 70px; border: 3px dashed #ffff00; display: flex; align-items: center; justify-content: center;
            font-family: 'Bangers', cursive; font-size: 3.5rem; color: #00ffff; text-shadow: 0 0 10px #00ffff;
        }
        .intro-hint { color: #888; font-size: 0.9rem; letter-spacing: 2px; text-transform: uppercase; margin-top: 10px; }

        /* --- HALAMAN UTAMA (RETRO POP) --- */
        #main-screen {
            display: none; min-height: 100vh;
            /* Polka dot Retro Pop Background */
            background-color: #ffeb3b;
            background-image: radial-gradient(#e91e63 15%, transparent 16%), radial-gradient(#e91e63 15%, transparent 16%);
            background-size: 40px 40px; background-position: 0 0, 20px 20px;
            color: #111; padding-bottom: 100px;
        }
        header { text-align: center; padding: 40px 20px; background: #00ffff; border-bottom: 8px solid #111; box-shadow: 0 10px 0px #e91e63; margin-bottom: 40px; }
        h1 { font-family: 'Bangers', cursive; font-size: 4rem; letter-spacing: 5px; color: #fff; text-shadow: 4px 4px 0 #111, -2px -2px 0 #111, 2px -2px 0 #111, -2px 2px 0 #111; }
        
        nav { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-bottom: 30px; }
        .nav-btn {
            background: #ff00ff; color: #fff; border: 4px solid #111; padding: 10px 20px; font-family: 'Space Mono', monospace; font-weight: bold;
            font-size: 1.1rem; cursor: pointer; box-shadow: 5px 5px 0px #111; transition: all 0.1s; text-transform: uppercase;
        }
        .nav-btn:active, .nav-btn.active { transform: translate(4px, 4px); box-shadow: 1px 1px 0px #111; background: #00ffff; color: #111; }

        main { max-width: 1000px; margin: 0 auto; padding: 0 20px; }
        .category-section { display: none; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .category-section.active { display: grid; }
        
        /* 3 Kolam Tanpa Cover */
        .kolam {
            background: #fff; border: 5px solid #111; height: 150px; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 1.2rem; cursor: pointer; box-shadow: 8px 8px 0px #111; transition: all 0.2s; text-align: center; padding: 10px;
        }
        .kolam:hover { background: #00ffff; transform: scale(1.05); }

        /* --- LIGHTBOX (PENAMPIL MEDIA) --- */
        #lightbox {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 3000; display: none; flex-direction: column; align-items: center; justify-content: center;
        }
        #lb-close {
            position: absolute; top: 20px; right: 30px; background: #ff00ff; color: #fff; border: 4px solid #fff; font-size: 2rem;
            width: 50px; height: 50px; cursor: pointer; font-family: 'Bangers', cursive; box-shadow: 4px 4px 0px #00ffff;
        }
        #lb-content { width: 90%; height: 80%; display: flex; justify-content: center; align-items: center; }
        #lb-content img, #lb-content video, #lb-content iframe { max-width: 100%; max-height: 100%; border: 8px solid #fff; box-shadow: 0 0 30px #ff00ff; }
        #lb-content iframe { width: 80%; height: 100%; background: #fff; }

        /* --- SOSIAL MEDIA & WHATSAPP --- */
        #social-container { position: fixed; bottom: 30px; right: 30px; z-index: 1000; display: flex; flex-direction: column; align-items: flex-end; gap: 15px; }
        #social-menu { display: none; flex-direction: column; gap: 10px; }
        .soc-btn {
            background: #fff; border: 4px solid #111; padding: 10px 20px; font-weight: bold; cursor: pointer;
            box-shadow: 4px 4px 0px #111; text-decoration: none; color: #111; display: block; text-align: center;
        }
        .soc-btn.wa { background: #25D366; color: white; }
        .soc-btn.ig { background: #E1306C; color: white; }
        
        #fab-toggle {
            width: 70px; height: 70px; border-radius: 50%; background: #00ffff; border: 5px solid #111; cursor: pointer;
            font-size: 2rem; font-weight: bold; box-shadow: 5px 5px 0px #111; display: flex; justify-content: center; align-items: center;
        }

        /* Responsif */
        @media (max-width: 768px) {
            .category-section { grid-template-columns: 1fr; }
            .scattered-letter { font-size: 3.5rem; }
            .slot { width: 40px; height: 55px; font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div id="intro-screen">
        <div id="scatter-container"></div>
        <div id="slots-container"></div>
        <div class="intro-hint">Klik huruf sesuai urutan untuk menyusun kata</div>
    </div>

    <div id="main-screen">
        <header>
            <h1>RETRO POP STUDIO</h1>
        </header>

        <nav>
            <button class="nav-btn active" onclick="showCategory('fotografi')">Fotografi</button>
            <button class="nav-btn" onclick="showCategory('video')">Video</button>
            <button class="nav-btn" onclick="showCategory('desain')">Desain</button>
            <button class="nav-btn" onclick="showCategory('3d')">3D Desain</button>
        </nav>

        <main>
            <section id="cat-fotografi" class="category-section active">
                <div class="kolam" onclick="openMedia('img', 'https://picsum.photos/id/1015/800/600')">Karya Foto 1</div>
                <div class="kolam" onclick="openMedia('img', 'https://picsum.photos/id/1016/800/600')">Karya Foto 2</div>
                <div class="kolam" onclick="openMedia('img', 'https://picsum.photos/id/1018/800/600')">Karya Foto 3</div>
            </section>

            <section id="cat-video" class="category-section">
                <div class="kolam" onclick="openMedia('vid', 'https://www.w3schools.com/html/mov_bbb.mp4')">Karya Video 1</div>
                <div class="kolam" onclick="openMedia('vid', 'https://www.w3schools.com/html/mov_bbb.mp4')">Karya Video 2</div>
                <div class="kolam" onclick="openMedia('vid', 'https://www.w3schools.com/html/mov_bbb.mp4')">Karya Video 3</div>
            </section>

            <section id="cat-desain" class="category-section">
                <div class="kolam" onclick="openMedia('img', 'https://picsum.photos/id/1025/800/600')">Desain Grafis 1</div>
                <div class="kolam" onclick="openMedia('img', 'https://picsum.photos/id/1027/800/600')">Desain Grafis 2</div>
                <div class="kolam" onclick="openMedia('pdf', 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf')">Brosur PDF</div>
            </section>

            <section id="cat-3d" class="category-section">
                <div class="kolam" onclick="openMedia('img', 'https://picsum.photos/id/1062/800/600')">Render 3D 1</div>
                <div class="kolam" onclick="openMedia('img', 'https://picsum.photos/id/1074/800/600')">Render 3D 2</div>
                <div class="kolam" onclick="openMedia('img', 'https://picsum.photos/id/1084/800/600')">Render 3D 3</div>
            </section>
        </main>

        <div id="social-container">
            <div id="social-menu">
                <a href="#" class="soc-btn wa" target="_blank">WhatsApp</a>
                <a href="#" class="soc-btn ig" target="_blank">Instagram</a>
            </div>
            <button id="fab-toggle" onclick="toggleSocial()">💬</button>
        </div>
    </div>

    <div id="lightbox">
        <button id="lb-close" onclick="closeLightbox()">X</button>
        <div id="lb-content"></div>
    </div>

    <script>
        /* =========================================
           1. WEB AUDIO API (SUARA GITAR)
           ========================================= */
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function playGuitarPluck() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = 'triangle'; // Suara menyerupai dawai dipetik
            // Nada acak agar seperti memetik senar yang berbeda
            osc.frequency.setValueAtTime(300 + Math.random() * 300, audioCtx.currentTime); 
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            // Efek Petikan (Suara keras lalu memudar cepat)
            gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        /* =========================================
           2. LOGIKA PUZZLE "PERMISI"
           ========================================= */
        const targetWord = ['P', 'E', 'R', 'M', 'I', 'S', 'I'];
        let currentStep = 0;
        
        const scatterContainer = document.getElementById('scatter-container');
        const slotsContainer = document.getElementById('slots-container');

        // Buat Kotak Kosong (Slots)
        targetWord.forEach(() => {
            const slot = document.createElement('div');
            slot.className = 'slot';
            slotsContainer.appendChild(slot);
        });

        // Buat Huruf Berhamburan (Acak)
        const shuffledLetters = [...targetWord].sort(() => Math.random() - 0.5);
        
        shuffledLetters.forEach((letter) => {
            const el = document.createElement('div');
            el.className = 'scattered-letter';
            el.innerText = letter;
            
            // Posisi berhamburan acak (Antara 10% s/d 80% layar agar tidak keluar batas)
            el.style.left = Math.floor(Math.random() * 70 + 10) + '%';
            el.style.top = Math.floor(Math.random() * 60 + 10) + '%';
            
            el.onclick = () => handleLetterClick(el, letter);
            scatterContainer.appendChild(el);
        });

        function handleLetterClick(el, letter) {
            playGuitarPluck(); // Bunyikan gitar
            
            if (letter === targetWord[currentStep]) {
                // Benar! Masukkan ke kotak
                const slots = document.querySelectorAll('.slot');
                slots[currentStep].innerText = letter;
                el.style.display = 'none'; // Sembunyikan huruf yang berhamburan
                currentStep++;
                
                // Jika semua tersusun
                if (currentStep === targetWord.length) {
                    setTimeout(() => {
                        document.getElementById('intro-screen').style.display = 'none';
                        document.getElementById('main-screen').style.display = 'block';
                        document.body.style.backgroundColor = '#ffeb3b'; // Ubah background dasar
                    }, 500);
                }
            } else {
                // Salah! Bergetar
                el.classList.add('shake');
                setTimeout(() => el.classList.remove('shake'), 400);
            }
        }

        /* =========================================
           3. NAVIGASI KATEGORI
           ========================================= */
        function showCategory(catId) {
            // Sembunyikan semua section
            document.querySelectorAll('.category-section').forEach(sec => sec.classList.remove('active'));
            // Tampilkan yang dipilih
            document.getElementById('cat-' + catId).classList.add('active');
            
            // Update warna tombol nav
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        /* =========================================
           4. ALAT PENAMPIL (LIGHTBOX)
           ========================================= */
        const lightbox = document.getElementById('lightbox');
        const lbContent = document.getElementById('lb-content');

        function openMedia(type, url) {
            lightbox.style.display = 'flex';
            lbContent.innerHTML = ''; // Bersihkan konten sebelumnya
            
            if (type === 'img') {
                lbContent.innerHTML = `<img src="${url}" alt="Gambar">`;
            } else if (type === 'vid') {
                lbContent.innerHTML = `<video src="${url}" controls autoplay></video>`;
            } else if (type === 'pdf') {
                lbContent.innerHTML = `<iframe src="${url}"></iframe>`;
            }
        }

        function closeLightbox() {
            lightbox.style.display = 'none';
            lbContent.innerHTML = ''; // Matikan video jika sedang main
        }

        /* =========================================
           5. SOSIAL MEDIA TOGGLE
           ========================================= */
        function toggleSocial() {
            const menu = document.getElementById('social-menu');
            if (menu.style.display === 'flex') {
                menu.style.display = 'none';
            } else {
                menu.style.display = 'flex';
            }
        }
    </script>
</body>
</html>
