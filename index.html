<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Pop Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* ================= CSS VARIABEL & RESET ================= */
        :root {
            --neon-pink: #FF007F;
            --neon-cyan: #00F0FF;
            --neon-yellow: #FFE600;
            --neon-purple: #8A2BE2;
            --bg-dark: #121212;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
        }

        /* ================= HALAMAN ENTRY 'PERMISI' ================= */
        #entry-gate {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, #2a0845 0%, #000000 100%);
            z-index: 9999;
            display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
            transition: opacity 1s ease-out;
        }
        .scattered-letter {
            position: absolute;
            font-family: 'Righteous', cursive;
            font-size: 5rem;
            color: var(--neon-yellow);
            text-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink);
            cursor: pointer;
            user-select: none;
            transition: all 0.5s ease;
        }
        .scattered-letter:hover { color: var(--neon-cyan); transform: scale(1.2); }
        #dock {
            display: flex; gap: 10px; margin-bottom: 50px;
            min-height: 80px; padding: 10px;
            border-bottom: 3px dashed var(--neon-cyan);
        }
        .docked-letter {
            font-family: 'Righteous', cursive;
            font-size: 4rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 15px var(--neon-cyan);
        }
        .hint-text {
            position: absolute; top: 20px; font-family: 'Righteous'; color: var(--neon-pink);
            letter-spacing: 2px; text-shadow: 0 0 5px var(--neon-pink);
        }

        /* ================= HALAMAN UTAMA (MAIN SITE) ================= */
        #main-site { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; }
        
        /* Navigasi */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 0; border-bottom: 4px solid var(--neon-pink);
            margin-bottom: 30px;
        }
        .logo { font-family: 'Righteous', cursive; font-size: 2.5rem; color: var(--neon-yellow); text-shadow: 2px 2px 0px var(--neon-purple); }
        nav { display: flex; gap: 15px; flex-wrap: wrap; }
        button {
            background: transparent; color: white; font-family: 'Righteous', cursive;
            font-size: 1.2rem; border: 2px solid var(--neon-cyan); padding: 8px 16px;
            cursor: pointer; transition: 0.3s;
            text-transform: uppercase;
        }
        button:hover, .active-btn { background: var(--neon-cyan); color: #000; box-shadow: 0 0 15px var(--neon-cyan); }
        
        .btn-kontak { border-color: var(--neon-yellow); color: var(--neon-yellow); }
        .btn-kontak:hover { background: var(--neon-yellow); color: #000; box-shadow: 0 0 15px var(--neon-yellow); }

        /* Sosial Media Modal */
        #social-modal {
            display: none; background: rgba(0,0,0,0.9); border: 2px solid var(--neon-pink);
            padding: 20px; position: absolute; right: 20px; top: 80px; z-index: 100;
            box-shadow: 0 0 20px var(--neon-pink); text-align: center;
        }
        .social-link {
            display: block; color: var(--neon-cyan); text-decoration: none;
            margin: 10px 0; font-size: 1.2rem; font-weight: bold;
        }
        .social-link:hover { color: var(--neon-yellow); }

        /* Area Konten Dinamis (Kolam/Grid) */
        .breadcrumb { margin-bottom: 20px; color: var(--neon-pink); font-size: 1.2rem; font-weight: bold; cursor: pointer;}
        .grid-3 {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
        }
        .card {
            background: #222; border: 3px solid var(--neon-purple); padding: 20px;
            text-align: center; cursor: pointer; transition: 0.3s; position: relative;
            min-height: 150px; display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .card:hover {
            transform: translateY(-10px); border-color: var(--neon-pink);
            box-shadow: 0 10px 20px rgba(255, 0, 127, 0.4);
        }
        .card h3 { font-family: 'Righteous', cursive; font-size: 1.5rem; letter-spacing: 1px;}
        .card-cover { width: 100%; height: 100px; object-fit: cover; margin-bottom: 15px; border: 1px solid #555; }

        /* ================= LIGHTBOX (VIEWER MEDIA) ================= */
        #lightbox {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.95); z-index: 10000; justify-content: center; align-items: center;
            flex-direction: column;
        }
        #lb-close {
            position: absolute; top: 20px; right: 30px; background: transparent; border: none;
            color: var(--neon-pink); font-size: 3rem; font-family: 'Righteous'; cursor: pointer;
        }
        #lb-close:hover { color: var(--neon-yellow); text-shadow: 0 0 10px var(--neon-yellow); }
        #lb-content-area { width: 90%; height: 80%; display: flex; justify-content: center; align-items: center; }
        .lb-media { max-width: 100%; max-height: 100%; border: 3px solid var(--neon-cyan); box-shadow: 0 0 30px var(--neon-cyan); }
        iframe.lb-media { width: 100%; height: 100%; background: white; }

        @media (max-width: 768px) {
            .grid-3 { grid-template-columns: 1fr; }
            .scattered-letter { font-size: 3rem; }
            .docked-letter { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div id="entry-gate">
        <h2 class="hint-text">Klik huruf berhamburan untuk menyusun: PERMISI</h2>
        <div id="scatter-area"></div>
        <div id="dock"></div>
    </div>

    <div id="main-site">
        <header>
            <div class="logo">Opang Darmawan</div>
            <nav id="main-nav">
                <button onclick="loadCategory('Fotografi')">Fotografi</button>
                <button onclick="loadCategory('Video')">Video</button>
                <button onclick="loadCategory('Desain')">Desain</button>
                <button onclick="loadCategory('3Ddesain')">3Ddesain</button>
                <button class="btn-kontak" onclick="toggleSocial()">Kontak</button>
            </nav>
        </header>

        <div id="social-modal">
            <a href="https://wa.me/1234567890" target="_blank" class="social-link">WhatsApp</a>
            <a href="https://instagram.com" target="_blank" class="social-link">Instagram</a>
            <a href="https://twitter.com" target="_blank" class="social-link">Twitter / X</a>
        </div>

        <main>
            <div id="breadcrumb" class="breadcrumb" onclick="goBack()" style="display:none;">&larr; Kembali</div>
            <div id="content-grid" class="grid-3">
                </div>
        </main>
    </div>

    <div id="lightbox">
        <button id="lb-close" onclick="closeLightbox()">X</button>
        <div id="lb-content-area"></div>
    </div>

    <script>
        /* ================= 1. AUDIO SYNTHESIZER (SUARA GITAR) ================= */
        let audioCtx;
        function playGuitar(freq) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = 'triangle'; // Mirip petikan senar
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 1.5);
        }

        // Nada untuk P-E-R-M-I-S-I
        const frequencies = { 'P': 164.81, 'E': 220.00, 'R': 293.66, 'M': 392.00, 'I': 493.88, 'S': 659.25, 'I2': 880.00 };

        /* ================= 2. LOGIKA ENTRY GATE 'PERMISI' ================= */
        const word = "PERMISI";
        const scatterArea = document.getElementById('scatter-area');
        const dock = document.getElementById('dock');
        let currentLetterIndex = 0;

        // Inisialisasi huruf berhamburan
        function initGate() {
            let lettersArray = word.split('');
            // Acak urutan huruf di layar
            let shuffled = [...lettersArray].sort(() => Math.random() - 0.5);
            
            shuffled.forEach((char, index) => {
                let span = document.createElement('span');
                span.textContent = char;
                span.className = 'scattered-letter';
                // Posisi acak di layar (menghindari tepi layar)
                span.style.top = Math.floor(Math.random() * 60 + 10) + '%';
                span.style.left = Math.floor(Math.random() * 80 + 10) + '%';
                
                span.onclick = () => handleLetterClick(span, char);
                scatterArea.appendChild(span);
            });
        }

        function handleLetterClick(element, char) {
            const expectedChar = word[currentLetterIndex];
            
            if (char === expectedChar) {
                // Mainkan nada gitar yang semakin tinggi
                let freqKey = (char === 'I' && currentLetterIndex === 6) ? 'I2' : char;
                playGuitar(frequencies[freqKey] || 440);

                // Pindahkan ke dock
                element.style.display = 'none';
                let dockedChar = document.createElement('span');
                dockedChar.textContent = char;
                dockedChar.className = 'docked-letter';
                dock.appendChild(dockedChar);
                
                currentLetterIndex++;
                
                if (currentLetterIndex === word.length) {
                    setTimeout(unlockSite, 800); // Buka situs setelah selesai
                }
            } else {
                // Jika salah klik, getar/efek error (opsional: suara sumbang)
                element.style.transform = "translateX(10px)";
                setTimeout(() => element.style.transform = "scale(1)", 200);
            }
        }

        function unlockSite() {
            document.getElementById('entry-gate').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('entry-gate').style.display = 'none';
                document.getElementById('main-site').style.display = 'block';
                loadCategory('Fotografi'); // Muat kategori awal
            }, 1000);
        }

        initGate();

        /* ================= 3. LOGIKA KONTEN UTAMA & KOLAM (GRIDS) ================= */
        // Struktur Data (3 Kolom Utama -> 3 Kolom Sub/Media)
        const db = {
            "Fotografi": [
                { title: "Fotografi Ai", cover: "OKV06886b.jpg", items: [
                    { type: cover: "OKV06886b.jpg", src: "OKV06886b.jpg", title: "Memancing Kemungkinan" },
                    { type: "img", src: "Image_2aiu2b2aiu2b2aiub.jpg", title: "Batas Kemungkinan" },
                    { type: "img", src: "Image_brzrz9brzrz9brzrd.jpg", title: "Menyelami Kemungkinan" }
                ]},
                { title: "Fotografi Kamera", cover: "https://placehold.co/400x300/00F0FF/000?text=Kamera+Cover", items: [
                    { type: "img", src: "https://placehold.co/800x600/222/FFF?text=Foto+Kamera+1", title: "Jepretan 1" },
                    { type: "img", src: "https://placehold.co/800x600/333/FFF?text=Foto+Kamera+2", title: "Jepretan 2" },
                    { type: "img", src: "https://placehold.co/800x600/444/FFF?text=Foto+Kamera+3", title: "Jepretan 3" }
                ]},
                { title: "Di Balik Layar", cover: "https://placehold.co/400x300/FFE600/000?text=BTS+Cover", items: [
                    { type: "pdf", src: "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf", title: "Jurnal Pemotretan (PDF)" },
                    { type: "img", src: "https://placehold.co/800x600/666/FFF?text=BTS+1", title: "BTS 1" },
                    { type: "img", src: "https://placehold.co/800x600/777/FFF?text=BTS+2", title: "BTS 2" }
                ]}
            ],
            "Video": [
                { title: "Klip Musik", cover: "https://placehold.co/400x300/8A2BE2/FFF?text=Klip+Musik", items: [
                    { type: "video", src: "https://www.w3schools.com/html/mov_bbb.mp4", title: "Video Klip 1" },
                    { type: "video", src: "https://www.w3schools.com/html/mov_bbb.mp4", title: "Video Klip 2" },
                    { type: "video", src: "https://www.w3schools.com/html/mov_bbb.mp4", title: "Video Klip 3" }
                ]},
                { title: "Iklan Komersial", cover: "https://placehold.co/400x300/FF007F/FFF?text=Iklan", items: [ /* Isi serupa */ ] },
                { title: "Dokumenter", cover: "https://placehold.co/400x300/00F0FF/000?text=Dokumenter", items: [ /* Isi serupa */ ] }
            ],
            "Desain": [
                { title: "Poster Retro", cover: "https://placehold.co/400x300/FFE600/000?text=Poster+Retro", items: [
                    { type: "img", src: "https://placehold.co/800x1200/FFE600/000?text=Poster+1", title: "Poster 1" },
                    { type: "img", src: "https://placehold.co/800x1200/FF007F/000?text=Poster+2", title: "Poster 2" },
                    { type: "img", src: "https://placehold.co/800x1200/00F0FF/000?text=Poster+3", title: "Poster 3" }
                ]},
                { title: "Logo Bisnis", cover: "https://placehold.co/400x300/8A2BE2/FFF?text=Logo", items: [ /* Isi serupa */ ] },
                { title: "Brosur (PDF)", cover: "https://placehold.co/400x300/222/FFF?text=Brosur", items: [
                    { type: "pdf", src: "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf", title: "Brosur 1 (PDF)" },
                    { type: "pdf", src: "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf", title: "Brosur 2 (PDF)" },
                    { type: "pdf", src: "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf", title: "Brosur 3 (PDF)" }
                ]}
            ],
            "3Ddesain": [
                { title: "Karakter 3D", cover: "https://placehold.co/400x300/00F0FF/000?text=Karakter+3D", items: [
                    { type: "img", src: "https://placehold.co/800x600/00F0FF/000?text=Karakter+1", title: "Karakter 1" },
                    { type: "img", src: "https://placehold.co/800x600/FF007F/000?text=Karakter+2", title: "Karakter 2" },
                    { type: "img", src: "https://placehold.co/800x600/FFE600/000?text=Karakter+3", title: "Karakter 3" }
                ]},
                { title: "Lingkungan/Environment", cover: "https://placehold.co/400x300/FF007F/FFF?text=Environment", items: [ /* Isi serupa */ ] },
                { title: "Animasi 3D (Video)", cover: "https://placehold.co/400x300/8A2BE2/FFF?text=Animasi", items: [
                    { type: "video", src: "https://www.w3schools.com/html/mov_bbb.mp4", title: "Render 1" },
                    { type: "video", src: "https://www.w3schools.com/html/mov_bbb.mp4", title: "Render 2" },
                    { type: "video", src: "https://www.w3schools.com/html/mov_bbb.mp4", title: "Render 3" }
                ]}
            ]
        };

        let currentCategory = '';
        const grid = document.getElementById('content-grid');
        const breadcrumb = document.getElementById('breadcrumb');

        function loadCategory(catName) {
            currentCategory = catName;
            grid.innerHTML = '';
            breadcrumb.style.display = 'none'; // Sembunyikan tombol kembali
            
            // Highlight Menu
            document.querySelectorAll('#main-nav button').forEach(b => b.classList.remove('active-btn'));
            event.target.classList.add('active-btn');

            let columns = db[catName];
            if(!columns) return; // Jika kategori kosong (untuk demo)

            columns.forEach((col, index) => {
                let card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${col.cover}" class="card-cover" alt="Cover">
                    <h3>${col.title}</h3>
                `;
                // Jika di klik, buka 3 sub-kolam/item media
                card.onclick = () => loadSubItems(catName, index);
                grid.appendChild(card);
            });
        }

        function loadSubItems(catName, colIndex) {
            grid.innerHTML = '';
            breadcrumb.style.display = 'block'; // Tampilkan tombol kembali
            breadcrumb.innerText = `← Kembali ke kategori ${catName}`;
            
            let items = db[catName][colIndex].items;
            if(!items || items.length === 0) {
                grid.innerHTML = '<h3 style="color:var(--neon-pink)">Konten belum tersedia di kolom ini.</h3>';
                return;
            }

            items.forEach(item => {
                let card = document.createElement('div');
                card.className = 'card';
                
                // Menentukan ikon/cover berdasarkan tipe media
                let coverTxt = item.type.toUpperCase();
                let coverColor = item.type === 'pdf' ? 'FF0000/FFF' : (item.type === 'video' ? '8A2BE2/FFF' : '222/FFF');
                
                card.innerHTML = `
                    <img src="https://placehold.co/400x300/${coverColor}?text=${coverTxt}" class="card-cover" alt="Tipe">
                    <h3>${item.title}</h3>
                `;
                card.onclick = () => openLightbox(item.type, item.src);
                grid.appendChild(card);
            });
        }

        function goBack() {
            loadCategory(currentCategory);
        }

        /* ================= 4. LOGIKA LAINNYA (Sosmed & Lightbox) ================= */
        function toggleSocial() {
            const modal = document.getElementById('social-modal');
            modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
        }

        function openLightbox(type, src) {
            const lb = document.getElementById('lightbox');
            const contentArea = document.getElementById('lb-content-area');
            contentArea.innerHTML = ''; // Bersihkan isi sebelumnya

            if (type === 'img') {
                contentArea.innerHTML = `<img src="${src}" class="lb-media">`;
            } else if (type === 'video') {
                contentArea.innerHTML = `<video src="${src}" class="lb-media" controls autoplay></video>`;
            } else if (type === 'pdf') {
                // Menggunakan iframe untuk menampilkan PDF secara native di browser
                contentArea.innerHTML = `<iframe src="${src}" class="lb-media"></iframe>`;
            }
            
            lb.style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
            document.getElementById('lb-content-area').innerHTML = ''; // Matikan video/audio
        }
    </script>
</body>
</html>
