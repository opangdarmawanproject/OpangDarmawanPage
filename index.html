<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retro Pop Portfolio</title>
<style>
    /* ----- GAYA UMUM (RETRO POP) ----- */
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Righteous&display=swap');
    
    body, html { margin: 0; padding: 0; height: 100%; background-color: #110022; color: #fff; font-family: 'Righteous', cursive; overflow-x: hidden; }
    
    /* ----- HALAMAN INTRO ----- */
    #intro-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: linear-gradient(135deg, #2b00ff, #ff007f); z-index: 100; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 50px; }
    #scatter-area { position: absolute; top: 0; left: 0; width: 100%; height: 80%; }
    .letter { position: absolute; font-family: 'Press Start 2P', monospace; font-size: 3rem; color: #fff; cursor: pointer; user-select: none; transition: transform 0.2s, text-shadow 0.2s; }
    .letter:hover { transform: scale(1.2); }
    .letter.glow { text-shadow: 0 0 10px #0ff, 0 0 20px #0ff, 0 0 40px #ff00ff, 0 0 80px #ff00ff; color: #ffff00; }
    
    #target-area { display: flex; gap: 15px; margin-bottom: 50px; z-index: 10; background: rgba(0,0,0,0.5); padding: 20px; border-radius: 10px; border: 3px dashed #0ff; }
    .slot { width: 50px; height: 50px; border-bottom: 5px solid #ffcc00; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-family: 'Press Start 2P', monospace; }

    /* ----- HALAMAN UTAMA ----- */
    #main-screen { display: none; min-height: 100vh; background: #110022; background-image: radial-gradient(#ff007f 1px, transparent 1px), radial-gradient(#00f3ff 1px, transparent 1px); background-size: 40px 40px; background-position: 0 0, 20px 20px; padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 20px; background: #ff007f; border: 4px solid #0ff; box-shadow: 8px 8px 0px #00f3ff; margin-bottom: 30px; }
    header h1 { margin: 0; font-size: 2.5rem; text-shadow: 3px 3px 0 #ffff00; letter-spacing: 2px; }
    
    .btn-retro { background: #ffff00; color: #110022; border: 3px solid #110022; padding: 10px 20px; font-family: 'Righteous', cursive; font-size: 1.2rem; cursor: pointer; box-shadow: 4px 4px 0px #ff007f; transition: all 0.1s; text-transform: uppercase; }
    .btn-retro:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px; }

    /* Menu & Kolam */
    .menu-bar { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin-bottom: 40px; }
    #content-area { display: flex; flex-direction: column; gap: 20px; }
    .kolam-container { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
    .kolam { flex: 1; min-width: 250px; background: #220044; border: 4px solid #ff007f; padding: 30px; text-align: center; cursor: pointer; box-shadow: 5px 5px 0 #00f3ff; transition: 0.2s; }
    .kolam:hover { background: #ff007f; border-color: #ffff00; box-shadow: 5px 5px 0 #ffff00; }
    .kolam h3 { margin: 0; font-size: 1.5rem; }

    /* Social Dropdown */
    .social-dropdown { position: relative; display: inline-block; }
    .social-content { display: none; position: absolute; right: 0; top: 50px; background-color: #00f3ff; min-width: 200px; box-shadow: 5px 5px 0 #ff007f; border: 3px solid #110022; z-index: 1; }
    .social-content a { color: #110022; padding: 12px 16px; text-decoration: none; display: block; font-weight: bold; border-bottom: 2px dashed #110022; }
    .social-content a:hover { background-color: #ffff00; }

    /* ----- MEDIA VIEWER (FULLSCREEN) ----- */
    #media-viewer { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.95); z-index: 9999; justify-content: center; align-items: center; }
    #viewer-content { width: 80%; height: 80%; display: flex; justify-content: center; align-items: center; }
    #viewer-content img, #viewer-content video { max-width: 100%; max-height: 100%; border: 5px solid #ff007f; box-shadow: 0 0 30px #0ff; }
    #viewer-content iframe { width: 100%; height: 100%; border: 5px solid #00f3ff; box-shadow: 0 0 30px #ff007f; }
    .close-btn { position: absolute; top: 20px; right: 40px; font-size: 4rem; color: #ff007f; cursor: pointer; font-family: sans-serif; text-shadow: 0 0 10px #ff007f; transition: 0.2s; }
    .close-btn:hover { color: #ffff00; }
</style>
</head>
<body>

    <div id="intro-screen">
        <h2 style="position: absolute; top: 20px; color: #fff; text-shadow: 2px 2px 0 #000; font-family: sans-serif;">Klik huruf secara berurutan untuk menyusun "PERMISI"</h2>
        <div id="scatter-area"></div>
        <div id="target-area">
            <div class="slot" id="slot-0"></div><div class="slot" id="slot-1"></div>
            <div class="slot" id="slot-2"></div><div class="slot" id="slot-3"></div>
            <div class="slot" id="slot-4"></div><div class="slot" id="slot-5"></div>
            <div class="slot" id="slot-6"></div>
        </div>
    </div>

    <div id="main-screen">
        <header>
            <h1>RETRO STUDIOS</h1>
            <div class="social-dropdown">
                <button class="btn-retro" onclick="toggleSocial()">Kontak & Sosmed ▼</button>
                <div id="social-menu" class="social-content">
                    <a href="https://wa.me/6281234567890" target="_blank">🟢 WhatsApp</a>
                    <a href="#" target="_blank">🟣 Instagram</a>
                    <a href="#" target="_blank">🔵 Facebook</a>
                </div>
            </div>
        </header>

        <div class="menu-bar">
            <button class="btn-retro" onclick="loadKategori('Fotografi')">Fotografi</button>
            <button class="btn-retro" onclick="loadKategori('Video')">Video</button>
            <button class="btn-retro" onclick="loadKategori('Desain')">Desain</button>
            <button class="btn-retro" onclick="loadKategori('3D Desain')">3D Desain</button>
        </div>

        <div id="content-area">
            <h2 id="judul-kategori" style="text-align:center; color:#0ff; text-shadow: 2px 2px #ff007f;">Pilih Kategori Di Atas</h2>
            <div id="kolam-utama" class="kolam-container"></div>
        </div>
    </div>

    <div id="media-viewer">
        <span class="close-btn" onclick="closeViewer()">&times;</span>
        <div id="viewer-content"></div>
    </div>

<script>
    /* ================= LOGIKA INTRO (PERMISI) ================= */
    const kataKunci = "PERMISI";
    const scatterArea = document.getElementById('scatter-area');
    let currentIndex = 0;

    // Web Audio API untuk Suara Gitar (Sintesis Suara)
    function playGuitarSound(pitchIndex) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gainNode = ctx.createGain();
            
            // Frekuensi nada dasar (P-E-R-M-I-S-I disimulasikan seperti senar gitar)
            const freqs = [329.63, 349.23, 392.00, 440.00, 493.88, 523.25, 587.33]; 
            osc.type = 'sawtooth'; // Karakter suara mirip senar
            osc.frequency.setValueAtTime(freqs[pitchIndex % freqs.length], ctx.currentTime);
            
            osc.connect(gainNode);
            gainNode.connect(ctx.destination);
            
            osc.start();
            gainNode.gain.setValueAtTime(1, ctx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1); // Fading suara
            osc.stop(ctx.currentTime + 1);
        } catch(e) { console.log("Audio not supported"); }
    }

    function initIntro() {
        // Acak huruf di layar
        let hurufArr = kataKunci.split('');
        // Shuffle manual agar posisi di DOM tidak berurutan
        let shuffled = hurufArr.map((val, ind) => ({val, ind})).sort(() => Math.random() - 0.5);
        
        scatterArea.innerHTML = '';
        shuffled.forEach((obj) => {
            let span = document.createElement('span');
            span.className = 'letter';
            span.innerText = obj.val;
            span.dataset.targetChar = obj.val;
            
            // Posisi acak
            span.style.top = Math.floor(Math.random() * 70 + 10) + '%';
            span.style.left = Math.floor(Math.random() * 80 + 10) + '%';
            
            span.onclick = function() {
                if(this.dataset.targetChar === kataKunci[currentIndex]) {
                    // Benar
                    playGuitarSound(currentIndex);
                    this.classList.add('glow');
                    
                    // Pindahkan ke slot target
                    let slot = document.getElementById('slot-' + currentIndex);
                    slot.innerText = this.innerText;
                    slot.style.textShadow = "0 0 20px #0ff";
                    this.style.display = 'none'; // Sembunyikan yang diacak
                    
                    currentIndex++;
                    
                    if(currentIndex === kataKunci.length) {
                        setTimeout(() => {
                            document.getElementById('intro-screen').style.display = 'none';
                            document.getElementById('main-screen').style.display = 'block';
                        }, 800); // Jeda sebelum masuk halaman utama
                    }
                } else {
                    // Salah klik urutan (Reset)
                    alert('Urutan salah! Ingat kata: PERMISI');
                    currentIndex = 0;
                    for(let i=0; i<kataKunci.length; i++) {
                        document.getElementById('slot-'+i).innerText = '';
                    }
                    initIntro(); // Acak ulang
                }
            };
            scatterArea.appendChild(span);
        });
    }
    
    // Jalankan Intro
    initIntro();

    /* ================= LOGIKA HALAMAN UTAMA & KOLAM ================= */
    function toggleSocial() {
        let menu = document.getElementById("social-menu");
        menu.style.display = (menu.style.display === "block") ? "none" : "block";
    }

    // Data Dummy untuk Media Viewer
    // Kamu bisa ganti URL ini dengan link gambar, video, atau PDF aslimu.
    const mediaLinks = {
        'Fotografi': { type: 'img', url: 'https://images.unsplash.com/photo-1542038784456-1ea8e935640e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80' },
        'Video': { type: 'video', url: 'https://www.w3schools.com/html/mov_bbb.mp4' },
        'Desain': { type: 'img', url: 'https://images.unsplash.com/photo-1558655146-d09347e92766?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80' },
        '3D Desain': { type: 'pdf', url: 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf' }
    };

    function loadKategori(nama) {
        document.getElementById('judul-kategori').innerText = "Kategori: " + nama;
        let kolamUtama = document.getElementById('kolam-utama');
        kolamUtama.innerHTML = '';

        // Generate 3 Kolam Utama
        for(let i = 1; i <= 3; i++) {
            let kUtama = document.createElement('div');
            kUtama.className = 'kolam';
            kUtama.innerHTML = `<h3>${nama} - Bagian ${i}</h3><p>Klik untuk melihat isi</p>`;
            
            // Jika diklik, tampilkan 3 sub-kolam di bawahnya
            kUtama.onclick = function() {
                loadSubKolam(kUtama, nama, i);
            };
            kolamUtama.appendChild(kUtama);
        }
    }

    function loadSubKolam(parentDiv, namaKategori, indexUtama) {
        // Hapus sub-kolam yang mungkin sudah terbuka di tempat lain untuk menjaga kerapian
        document.querySelectorAll('.sub-container').forEach(el => el.remove());

        let subContainer = document.createElement('div');
        subContainer.className = 'kolam-container sub-container';
        subContainer.style.marginTop = '20px';
        subContainer.style.width = '100%';

        // Generate 3 Sub Kolam
        for(let j = 1; j <= 3; j++) {
            let subKolam = document.createElement('div');
            subKolam.className = 'kolam';
            subKolam.style.background = '#00f3ff';
            subKolam.style.color = '#110022';
            subKolam.style.borderColor = '#ffff00';
            subKolam.innerHTML = `<h3>Item ${j}</h3><p>Lihat Media</p>`;
            
            // Jika diklik, buka Media Viewer
            subKolam.onclick = function(e) {
                e.stopPropagation(); // Mencegah klik men-trigger parent
                openViewer(mediaLinks[namaKategori].type, mediaLinks[namaKategori].url);
            };
            subContainer.appendChild(subKolam);
        }
        parentDiv.appendChild(subContainer);
    }

    /* ================= LOGIKA MEDIA VIEWER ================= */
    const viewer = document.getElementById('media-viewer');
    const viewerContent = document.getElementById('viewer-content');

    function openViewer(type, url) {
        viewerContent.innerHTML = ''; // Bersihkan isi sebelumnya
        viewer.style.display = 'flex';

        if (type === 'img') {
            viewerContent.innerHTML = `<img src="${url}" alt="Image Viewer">`;
        } else if (type === 'video') {
            viewerContent.innerHTML = `<video src="${url}" controls autoplay></video>`;
        } else if (type === 'pdf') {
            // Menggunakan Iframe untuk menampilkan PDF
            viewerContent.innerHTML = `<iframe src="${url}"></iframe>`;
        }
    }

    function closeViewer() {
        viewer.style.display = 'none';
        viewerContent.innerHTML = ''; // Hentikan video/audio saat ditutup
    }

    // Tutup dropdown jika user klik di luar area sosial media
    window.onclick = function(event) {
        if (!event.target.matches('.btn-retro') && !event.target.closest('.social-dropdown')) {
            let dropdowns = document.getElementsByClassName("social-content");
            for (let i = 0; i < dropdowns.length; i++) {
                let openDropdown = dropdowns[i];
                if (openDropdown.style.display === "block") {
                    openDropdown.style.display = "none";
                }
            }
        }
    }
</script>
</body>
</html>
