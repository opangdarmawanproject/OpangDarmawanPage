<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Pop Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* === GLOBAL STYLES & RETRO POP THEME === */
        :root {
            --neon-pink: #ff007f;
            --neon-cyan: #00ffff;
            --neon-yellow: #ffea00;
            --bg-color: #12002b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Righteous', cursive;
            background-color: var(--bg-color);
            color: white;
            overflow-x: hidden;
            background-image: 
                linear-gradient(rgba(18, 0, 43, 0.8), rgba(18, 0, 43, 0.8)),
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,255,255,0.1) 2px, rgba(0,255,255,0.1) 4px);
        }

        /* === LANDING PAGE (PERMISI PUZZLE) === */
        #landing-page {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 10;
        }
        .instruction {
            font-family: 'Press Start 2P', monospace;
            font-size: 14px;
            color: var(--neon-cyan);
            margin-bottom: 30px;
            text-align: center;
            text-shadow: 0 0 5px var(--neon-cyan);
        }
        .slots {
            display: flex;
            gap: 10px;
            margin-bottom: 50px;
        }
        .slot {
            width: 50px;
            height: 60px;
            border: 2px dashed var(--neon-yellow);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            color: white;
            text-shadow: 0 0 10px var(--neon-pink);
            cursor: pointer;
        }
        .scattered-letters {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            width: 80%;
            max-width: 600px;
        }
        .letter {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--bg-color);
            background: var(--neon-pink);
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 0 10px var(--neon-pink);
            transition: all 0.2s ease;
            transform: rotate(calc(-20deg + 40deg * var(--rand)));
        }
        .letter:hover, .letter:active {
            background: var(--neon-cyan);
            box-shadow: 0 0 20px var(--neon-cyan), 0 0 40px var(--neon-cyan);
            color: #000;
        }

        /* === MAIN PAGE === */
        #main-page {
            display: none;
            padding: 20px;
            min-height: 100vh;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        header h1 {
            font-size: 3rem;
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-cyan);
            margin-bottom: 20px;
        }
        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        nav button {
            background: transparent;
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 10px 20px;
            font-family: 'Righteous', cursive;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s;
        }
        nav button:hover, nav button.active {
            background: var(--neon-cyan);
            color: var(--bg-color);
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        /* === CATEGORY CONTENT (3 COLUMNS) === */
        .category-content {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .category-content.active {
            display: grid;
        }
        .media-item {
            background: #222;
            border: 2px solid var(--neon-pink);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s;
            position: relative;
        }
        .media-item:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px var(--neon-pink);
        }
        .media-item img, .media-item video {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }
        .media-item .overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.8);
            color: var(--neon-yellow);
            padding: 10px;
            text-align: center;
        }

        /* === SOCIAL MEDIA & WHATSAPP === */
        .social-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 100;
        }
        .social-btn {
            background: var(--neon-yellow);
            color: var(--bg-color);
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 0 15px var(--neon-yellow);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Righteous', cursive;
        }
        .social-menu {
            display: none;
            flex-direction: column;
            gap: 10px;
            position: absolute;
            bottom: 70px;
            right: 0;
        }
        .social-menu.show { display: flex; }
        .social-menu a {
            background: var(--neon-pink);
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            text-align: center;
            font-size: 1rem;
            white-space: nowrap;
            box-shadow: 0 0 10px var(--neon-pink);
        }
        .social-menu a:hover {
            background: var(--neon-cyan);
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        /* === MEDIA VIEWER (MODAL) === */
        #media-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        #media-modal.show { display: flex; }
        .modal-content {
            width: 80%;
            max-width: 900px;
            height: 80%;
            position: relative;
        }
        .modal-content iframe, .modal-content img, .modal-content video {
            width: 100%;
            height: 100%;
            border: 3px solid var(--neon-cyan);
            border-radius: 10px;
            box-shadow: 0 0 20px var(--neon-cyan);
            object-fit: contain;
        }
        .close-btn {
            position: absolute;
            top: -40px;
            right: 0;
            background: var(--neon-pink);
            color: white;
            border: none;
            font-size: 1.5rem;
            width: 40px; height: 40px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px var(--neon-pink);
        }

        /* RESPONSIVE MOBILE */
        @media (max-width: 768px) {
            .category-content { grid-template-columns: 1fr; }
            .slot { width: 40px; height: 50px; font-size: 1.5rem; }
            .letter { font-size: 1.8rem; padding: 10px; }
        }
    </style>
</head>
<body>

    <div id="landing-page">
        <div class="instruction">KLIK HURUF UNTUK MENYUSUN KATA</div>
        <div class="slots" id="slots-container">
            <div class="slot" data-index="0"></div>
            <div class="slot" data-index="1"></div>
            <div class="slot" data-index="2"></div>
            <div class="slot" data-index="3"></div>
            <div class="slot" data-index="4"></div>
            <div class="slot" data-index="5"></div>
            <div class="slot" data-index="6"></div>
        </div>
        <div class="scattered-letters" id="letters-container">
            </div>
    </div>

    <div id="main-page">
        <header>
            <h1>RETRO POP STUDIO</h1>
            <nav>
                <button class="nav-btn active" onclick="showCategory('fotografi')">Fotografi</button>
                <button class="nav-btn" onclick="showCategory('video')">Video</button>
                <button class="nav-btn" onclick="showCategory('desain')">Desain</button>
                <button class="nav-btn" onclick="showCategory('desain3d')">3D Desain</button>
            </nav>
        </header>

        <main>
            <div id="fotografi" class="category-content active">
                <div class="media-item" onclick="openModal('img', 'https://picsum.photos/800/600?random=1')">
                    <img src="https://picsum.photos/400/300?random=1" alt="Foto 1">
                    <div class="overlay">Foto Retro 1</div>
                </div>
                <div class="media-item" onclick="openModal('img', 'https://picsum.photos/800/600?random=2')">
                    <img src="https://picsum.photos/400/300?random=2" alt="Foto 2">
                    <div class="overlay">Foto Retro 2</div>
                </div>
                <div class="media-item" onclick="openModal('img', 'https://picsum.photos/800/600?random=3')">
                    <img src="https://picsum.photos/400/300?random=3" alt="Foto 3">
                    <div class="overlay">Foto Retro 3</div>
                </div>
            </div>

            <div id="video" class="category-content">
                <div class="media-item" onclick="openModal('vid', 'https://www.w3schools.com/html/mov_bbb.mp4')">
                    <video src="https://www.w3schools.com/html/mov_bbb.mp4" muted></video>
                    <div class="overlay">Video Clip 1</div>
                </div>
                <div class="media-item" onclick="openModal('vid', 'https://www.w3schools.com/html/mov_bbb.mp4')">
                    <video src="https://www.w3schools.com/html/mov_bbb.mp4" muted></video>
                    <div class="overlay">Video Clip 2</div>
                </div>
                <div class="media-item" onclick="openModal('vid', 'https://www.w3schools.com/html/mov_bbb.mp4')">
                    <video src="https://www.w3schools.com/html/mov_bbb.mp4" muted></video>
                    <div class="overlay">Video Clip 3</div>
                </div>
            </div>

            <div id="desain" class="category-content">
                <div class="media-item" onclick="openModal('img', 'https://picsum.photos/800/600?random=4')">
                    <img src="https://picsum.photos/400/300?random=4" alt="Desain 1">
                    <div class="overlay">Poster Synthwave</div>
                </div>
                <div class="media-item" onclick="openModal('img', 'https://picsum.photos/800/600?random=5')">
                    <img src="https://picsum.photos/400/300?random=5" alt="Desain 2">
                    <div class="overlay">Logo Neon</div>
                </div>
                <div class="media-item" onclick="openModal('img', 'https://picsum.photos/800/600?random=6')">
                    <img src="https://picsum.photos/400/300?random=6" alt="Desain 3">
                    <div class="overlay">Typography</div>
                </div>
            </div>

            <div id="desain3d" class="category-content">
                <div class="media-item" onclick="openModal('pdf', 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf')">
                    <img src="https://picsum.photos/400/300?random=7" alt="3D 1">
                    <div class="overlay">Blueprints 3D (PDF)</div>
                </div>
                <div class="media-item" onclick="openModal('pdf', 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf')">
                    <img src="https://picsum.photos/400/300?random=8" alt="3D 2">
                    <div class="overlay">Render Specs (PDF)</div>
                </div>
                <div class="media-item" onclick="openModal('pdf', 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf')">
                    <img src="https://picsum.photos/400/300?random=9" alt="3D 3">
                    <div class="overlay">Wireframe (PDF)</div>
                </div>
            </div>
        </main>

        <div class="social-container">
            <div class="social-menu" id="social-menu">
                <a href="https://wa.me/6281234567890" target="_blank">WhatsApp</a>
                <a href="#" target="_blank">Instagram</a>
                <a href="#" target="_blank">Twitter</a>
            </div>
            <button class="social-btn" onclick="toggleSocial()">💬</button>
        </div>
    </div>

    <div id="media-modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">X</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        // === 1. SISTEM AUDIO GITAR SEDERHANA (Web Audio API) ===
        let audioCtx;
        function playGuitarSound() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            // Nada acak untuk efek petikan gitar
            const freqs = [329.63, 392.00, 440.00, 523.25, 659.25]; // E4, G4, A4, C5, E5
            osc.frequency.value = freqs[Math.floor(Math.random() * freqs.length)];
            osc.type = 'triangle'; // Suara mirip petikan

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            // Efek suara memudar (fade out)
            gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1);

            osc.start();
            osc.stop(audioCtx.currentTime + 1);
        }

        // === 2. LOGIKA GAME "PERMISI" ===
        const wordToSpell = "PERMISI";
        const lettersArray = wordToSpell.split("");
        // Acak huruf-huruf di awal
        const shuffledLetters = [...lettersArray].sort(() => Math.random() - 0.5);

        const lettersContainer = document.getElementById('letters-container');
        const slots = document.querySelectorAll('.slot');

        // Render huruf yang berhamburan
        shuffledLetters.forEach((letter, i) => {
            const letterDiv = document.createElement('div');
            letterDiv.classList.add('letter');
            letterDiv.textContent = letter;
            letterDiv.style.setProperty('--rand', Math.random()); // Untuk rotasi acak CSS
            
            // Event klik pada huruf
            letterDiv.addEventListener('click', () => {
                playGuitarSound(); // Bunyi gitar
                
                // Cari slot kosong pertama
                const emptySlot = Array.from(slots).find(slot => slot.textContent === "");
                if (emptySlot) {
                    emptySlot.textContent = letter;
                    letterDiv.style.visibility = 'hidden'; // Sembunyikan huruf di bawah
                    checkWin();
                }
            });
            lettersContainer.appendChild(letterDiv);
        });

        // Event klik pada slot untuk mengembalikan huruf
        slots.forEach(slot => {
            slot.addEventListener('click', () => {
                if (slot.textContent !== "") {
                    playGuitarSound();
                    // Kembalikan huruf yang visibilitasnya tersembunyi
                    const hiddenLetter = Array.from(lettersContainer.children).find(l => 
                        l.style.visibility === 'hidden' && l.textContent === slot.textContent
                    );
                    if (hiddenLetter) hiddenLetter.style.visibility = 'visible';
                    slot.textContent = "";
                }
            });
        });

        function checkWin() {
            let currentSpelling = Array.from(slots).map(slot => slot.textContent).join("");
            if (currentSpelling === wordToSpell) {
                // Efek flash hijau saat berhasil
                slots.forEach(slot => {
                    slot.style.borderColor = "#00ff00";
                    slot.style.color = "#00ff00";
                    slot.style.textShadow = "0 0 20px #00ff00";
                });
                
                // Pindah ke Halaman Utama setelah 1 detik
                setTimeout(() => {
                    document.getElementById('landing-page').style.display = 'none';
                    document.getElementById('main-page').style.display = 'block';
                }, 1000);
            }
        }

        // === 3. MENU KATEGORI ===
        function showCategory(categoryId) {
            // Sembunyikan semua kategori
            document.querySelectorAll('.category-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            
            // Tampilkan kategori yang dipilih
            document.getElementById(categoryId).classList.add('active');
            event.target.classList.add('active');
        }

        // === 4. TOGGLE SOSIAL MEDIA ===
        function toggleSocial() {
            const menu = document.getElementById('social-menu');
            menu.classList.toggle('show');
        }

        // === 5. MEDIA VIEWER (MODAL) ===
        const modal = document.getElementById('media-modal');
        const modalBody = document.getElementById('modal-body');

        function openModal(type, url) {
            modal.classList.add('show');
            modalBody.innerHTML = ''; // Kosongkan isi sebelumnya

            if (type === 'img') {
                modalBody.innerHTML = `<img src="${url}" alt="Full size image">`;
            } else if (type === 'vid') {
                modalBody.innerHTML = `<video src="${url}" controls autoplay></video>`;
            } else if (type === 'pdf') {
                modalBody.innerHTML = `<iframe src="${url}" frameborder="0"></iframe>`;
            }
        }

        function closeModal() {
            modal.classList.remove('show');
            modalBody.innerHTML = ''; // Hentikan video/audio saat ditutup
        }
    </script>
</body>
</html>
