<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Pop Portofolio</title>
    <style>
        /* === CSS RETRO POP STYLE === */
        :root {
            --bg-color: #ffde00; /* Kuning Retro */
            --primary: #ff007f;  /* Pink Pop */
            --secondary: #00e5ff; /* Cyan */
            --dark: #111;
            --font-main: 'Courier New', Courier, monospace;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            font-family: var(--font-main);
            background-color: var(--bg-color);
            overflow-x: hidden;
            color: var(--dark);
        }

        * { box-sizing: border-box; }

        /* --- INTRO SCREEN (PERMISI) --- */
        #intro-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--dark);
            z-index: 9999;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            transition: opacity 1s ease, transform 1s ease;
        }

        .scattered-letter {
            position: absolute;
            font-size: 4rem; font-weight: 900;
            color: white; cursor: pointer;
            user-select: none; transition: all 0.3s ease;
            text-shadow: 4px 4px 0px var(--primary);
        }

        .scattered-letter:hover {
            transform: scale(1.2);
            color: var(--secondary);
            text-shadow: 0 0 20px var(--secondary), 4px 4px 0px var(--primary);
        }

        .glowing {
            color: var(--secondary) !important;
            text-shadow: 0 0 30px var(--secondary), 0 0 60px var(--secondary) !important;
        }

        #word-slot {
            position: absolute; bottom: 20%;
            display: flex; gap: 10px;
            font-size: 3rem; color: rgba(255,255,255,0.2);
            border-bottom: 4px dashed white; padding: 10px;
        }

        /* --- MAIN WEBSITE --- */
        #main-site {
            display: none; /* Disembunyikan sampai intro selesai */
            padding: 20px;
            max-width: 1200px; margin: 0 auto;
        }

        /* Header & Nav */
        header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 6px solid var(--dark);
            padding-bottom: 20px; margin-bottom: 30px;
            flex-wrap: wrap; gap: 20px;
        }

        h1.logo {
            font-size: 3rem; font-weight: 900; margin: 0;
            text-transform: uppercase; letter-spacing: -2px;
            color: white; text-shadow: 4px 4px 0px var(--dark), 8px 8px 0px var(--primary);
        }

        .retro-btn {
            background-color: var(--primary); color: white;
            border: 4px solid var(--dark); font-weight: bold;
            padding: 10px 20px; cursor: pointer; font-size: 1.2rem;
            box-shadow: 6px 6px 0px var(--dark); transition: all 0.1s;
            text-transform: uppercase; font-family: inherit;
        }

        .retro-btn:active {
            transform: translate(4px, 4px); box-shadow: 2px 2px 0px var(--dark);
        }

        .nav-menu { display: flex; gap: 15px; flex-wrap: wrap; }
        .nav-btn { background-color: white; color: var(--dark); }

        /* Grid Layout (3 Kolom) */
        .grid-container {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px; margin-top: 20px;
        }

        .card {
            background: white; border: 5px solid var(--dark);
            box-shadow: 10px 10px 0px var(--dark);
            cursor: pointer; transition: transform 0.2s;
            display: flex; flex-direction: column; overflow: hidden;
        }

        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; height: 200px; object-fit: cover; border-bottom: 5px solid var(--dark); }
        .card h3 { padding: 15px; margin: 0; font-size: 1.5rem; text-align: center; background: var(--secondary); border-top: 2px solid var(--dark); }

        /* Dynamic Section Info */
        #breadcrumb { font-size: 1.5rem; font-weight: bold; margin-bottom: 20px; text-transform: uppercase; border-bottom: 3px solid var(--dark); display: inline-block;}

        /* --- MODALS (Sosmed & Media Viewer) --- */
        .modal {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 10000;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(5px);
            align-items: center; justify-content: center;
        }

        .modal-content-box {
            background: var(--bg-color); border: 8px solid var(--dark);
            box-shadow: 15px 15px 0px var(--primary);
            padding: 30px; text-align: center; max-width: 400px; width: 90%;
            position: relative;
        }

        .close-btn {
            position: absolute; top: -20px; right: -20px;
            background: var(--primary); color: white; border: 4px solid var(--dark);
            width: 50px; height: 50px; font-size: 1.5rem; font-weight: bold;
            cursor: pointer; border-radius: 50%; box-shadow: 4px 4px 0px var(--dark);
        }

        .sosmed-link { display: block; margin: 15px 0; padding: 15px; background: white; border: 4px solid var(--dark); text-decoration: none; color: var(--dark); font-weight: bold; font-size: 1.2rem; box-shadow: 4px 4px 0px var(--dark); }
        .sosmed-link:hover { background: var(--secondary); }

        /* Media Viewer Mode */
        .media-viewer-content { width: 90%; height: 90%; max-width: 1200px; background: transparent; border: none; box-shadow: none; display: flex; justify-content: center; align-items: center; position: relative;}
        .media-viewer-content .close-btn { top: 0; right: 0; z-index: 10001; }
        .media-viewer-content img, .media-viewer-content video, .media-viewer-content iframe { width: 100%; height: 100%; max-height: 85vh; object-fit: contain; border: 8px solid white; background: #000; box-shadow: 10px 10px 0px var(--primary);}
    </style>
</head>
<body>

    <div id="intro-screen">
        <div id="letters-container"></div>
        <div id="word-slot">_ _ _ _ _ _ _</div>
    </div>

    <div id="main-site">
        <header>
            <h1 class="logo">Karya.Retro</h1>
            <div class="nav-menu">
                <button class="retro-btn nav-btn" onclick="loadCategory('Fotografi')">Fotografi</button>
                <button class="retro-btn nav-btn" onclick="loadCategory('Video')">Video</button>
                <button class="retro-btn nav-btn" onclick="loadCategory('Desain')">Desain</button>
                <button class="retro-btn nav-btn" onclick="loadCategory('3D Desain')">3D Desain</button>
            </div>
            <button class="retro-btn" onclick="openModal('sosmed-modal')">Kontak / Sosmed</button>
        </header>

        <div id="breadcrumb">Pilih Kategori di Atas</div>
        <div class="grid-container" id="content-grid">
            </div>
    </div>

    <div id="sosmed-modal" class="modal">
        <div class="modal-content-box">
            <button class="close-btn" onclick="closeModal('sosmed-modal')">X</button>
            <h2>HUBUNGI SAYA</h2>
            <a href="https://wa.me/6281234567890" target="_blank" class="sosmed-link" style="background:#25D366; color:white;">WhatsApp</a>
            <a href="https://instagram.com/username" target="_blank" class="sosmed-link">Instagram</a>
            <a href="https://behance.net/username" target="_blank" class="sosmed-link">Behance / Portofolio</a>
        </div>
    </div>

    <div id="media-modal" class="modal">
        <div class="media-viewer-content">
            <button class="close-btn" onclick="closeModal('media-modal')">X</button>
            <div id="media-container" style="width: 100%; height: 100%;"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // BAGIAN 1: SISTEM INTRO "PERMISI" & AUDIO
        // ==========================================
        const targetWord = "PERMISI";
        let currentIndex = 0;
        let audioCtx;

        // Synth Suara Gitar Sederhana (Web Audio API) - Aman, tanpa file eksternal!
        function playGuitarSound() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = 'triangle'; // Mirip petikan
            // Frekuensi acak agar seperti nada berbeda
            osc.frequency.setValueAtTime(200 + (currentIndex * 50) + Math.random()*50, audioCtx.currentTime); 
            
            gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 1);
        }

        function initIntro() {
            const container = document.getElementById('letters-container');
            const scrambled = targetWord.split('').sort(() => 0.5 - Math.random());
            
            scrambled.forEach((letter, index) => {
                const el = document.createElement('div');
                el.innerText = letter;
                el.className = 'scattered-letter';
                // Posisi acak di layar
                el.style.left = Math.floor(Math.random() * 80) + 10 + '%';
                el.style.top = Math.floor(Math.random() * 60) + 10 + '%';
                
                el.onclick = function() {
                    // Cek jika huruf sesuai urutan yang dibutuhkan ("P" -> "E" -> ...)
                    if (this.innerText === targetWord[currentIndex] && !this.classList.contains('clicked')) {
                        playGuitarSound();
                        this.classList.add('clicked', 'glowing');
                        
                        // Pindahkan huruf ke slot bawah
                        const slot = document.getElementById('word-slot');
                        this.style.position = 'static';
                        slot.insertBefore(this, slot.childNodes[currentIndex]);
                        
                        currentIndex++;
                        
                        // Update teks slot bantu
                        let dashText = "";
                        for(let i=0; i < targetWord.length - currentIndex; i++) dashText += "_ ";
                        slot.innerHTML = ""; // Bersihkan
                        document.querySelectorAll('.clicked').forEach(c => slot.appendChild(c));
                        slot.innerHTML += `<span> ${dashText}</span>`;

                        // Jika selesai
                        if (currentIndex === targetWord.length) {
                            setTimeout(() => {
                                document.getElementById('intro-screen').style.opacity = '0';
                                document.getElementById('intro-screen').style.transform = 'scale(2)';
                                setTimeout(() => {
                                    document.getElementById('intro-screen').style.display = 'none';
                                    document.getElementById('main-site').style.display = 'block';
                                    loadCategory('Fotografi'); // Muat default halaman
                                }, 1000);
                            }, 500);
                        }
                    } else {
                        // Efek jika salah klik urutan (Goyang)
                        this.style.transform = "translateX(10px)";
                        setTimeout(() => this.style.transform = "translateX(-10px)", 100);
                        setTimeout(() => this.style.transform = "none", 200);
                    }
                };
                container.appendChild(el);
            });
        }
        initIntro();

        // ==========================================
        // BAGIAN 2: DATABASE KONTEN & MEDIA
        // ==========================================
        // Anda bisa mengganti URL gambar/video/pdf di bawah ini dengan URL file milik Anda!
        const database = {
            "Fotografi": [
                { name: "Fotografi AI", cover: "https://picsum.photos/400/300?random=1", items: [
                    { type: "image", src: "https://picsum.photos/1200/800?random=10", title: "Karya AI 1" },
                    { type: "image", src: "https://picsum.photos/1200/800?random=11", title: "Karya AI 2" },
                    { type: "image", src: "https://picsum.photos/1200/800?random=12", title: "Karya AI 3" }
                ]},
                { name: "Fotografi Kamera", cover: "https://picsum.photos/400/300?random=2", items: [
                    { type: "image", src: "https://picsum.photos/1200/800?random=13", title: "Potret 1" },
                    { type: "image", src: "https://picsum.photos/1200/800?random=14", title: "Potret 2" },
                    { type: "image", src: "https://picsum.photos/1200/800?random=15", title: "Potret 3" }
                ]},
                { name: "Komersial / Produk", cover: "https://picsum.photos/400/300?random=3", items: [
                    { type: "image", src: "https://picsum.photos/1200/800?random=16", title: "Produk 1" },
                    { type: "image", src: "https://picsum.photos/1200/800?random=17", title: "Produk 2" },
                    { type: "image", src: "https://picsum.photos/1200/800?random=18", title: "Produk 3" }
                ]}
            ],
            "Video": [
                { name: "Music Video", cover: "https://picsum.photos/400/300?random=4", items: [
                    { type: "video", src: "https://www.w3schools.com/html/mov_bbb.mp4", title: "MV 1" },
                    { type: "video", src: "https://www.w3schools.com/html/mov_bbb.mp4", title: "MV 2" },
                    { type: "video", src: "https://www.w3schools.com/html/mov_bbb.mp4", title: "MV 3" }
                ]},
                { name: "Dokumenter", cover: "https://picsum.photos/400/300?random=5", items: [
                    { type: "video", src: "https://www.w3schools.com/html/mov_bbb.mp4", title: "Dokumenter 1" },
                    { type: "video", src: "https://www.w3schools.com/html/mov_bbb.mp4", title: "Dokumenter 2" },
                    { type: "video", src: "https://www.w3schools.com/html/mov_bbb.mp4", title: "Dokumenter 3" }
                ]},
                { name: "Iklan", cover: "https://picsum.photos/400/300?random=6", items: [
                    { type: "video", src: "https://www.w3schools.com/html/mov_bbb.mp4", title: "Iklan 1" },
                    { type: "video", src: "https://www.w3schools.com/html/mov_bbb.mp4", title: "Iklan 2" },
                    { type: "video", src: "https://www.w3schools.com/html/mov_bbb.mp4", title: "Iklan 3" }
                ]}
            ],
            "Desain": [
                 { name: "Branding", cover: "https://picsum.photos/400/300?random=7", items: [
                    { type: "image", src: "https://picsum.photos/1200/800?random=19", title: "Brand A" },
                    { type: "image", src: "https://picsum.photos/1200/800?random=20", title: "Brand B" },
                    { type: "pdf", src: "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf", title: "Brand Guidelines (PDF)" }
                ]},
                { name: "Poster", cover: "https://picsum.photos/400/300?random=8", items: [
                    { type: "image", src: "https://picsum.photos/800/1200?random=21", title: "Poster 1" },
                    { type: "image", src: "https://picsum.photos/800/1200?random=22", title: "Poster 2" },
                    { type: "image", src: "https://picsum.photos/800/1200?random=23", title: "Poster 3" }
                ]},
                { name: "UI/UX", cover: "https://picsum.photos/400/300?random=9", items: [
                    { type: "image", src: "https://picsum.photos/1200/800?random=24", title: "App 1" },
                    { type: "image", src: "https://picsum.photos/1200/800?random=25", title: "App 2" },
                    { type: "image", src: "https://picsum.photos/1200/800?random=26", title: "App 3" }
                ]}
            ],
            "3D Desain": [
                { name: "Karakter", cover: "https://picsum.photos/400/300?random=27", items: [
                    { type: "image", src: "https://picsum.photos/1200/800?random=28", title: "Hero" },
                    { type: "image", src: "https://picsum.photos/1200/800?random=29", title: "Villain" },
                    { type: "image", src: "https://picsum.photos/1200/800?random=30", title: "NPC" }
                ]},
                { name: "Environment", cover: "https://picsum.photos/400/300?random=31", items: [
                    { type: "image", src: "https://picsum.photos/1200/800?random=32", title: "Kota" },
                    { type: "image", src: "https://picsum.photos/1200/800?random=33", title: "Hutan" },
                    { type: "image", src: "https://picsum.photos/1200/800?random=34", title: "Luar Angkasa" }
                ]},
                { name: "Animasi 3D", cover: "https://picsum.photos/400/300?random=35", items: [
                    { type: "video", src: "https://www.w3schools.com/html/mov_bbb.mp4", title: "Walk Cycle" },
                    { type: "video", src: "https://www.w3schools.com/html/mov_bbb.mp4", title: "Combat" },
                    { type: "video", src: "https://www.w3schools.com/html/mov_bbb.mp4", title: "Short Movie" }
                ]}
            ]
        };

        // ==========================================
        // BAGIAN 3: FUNGSI NAVIGASI & RENDER DOM
        // ==========================================
        const grid = document.getElementById('content-grid');
        const breadcrumb = document.getElementById('breadcrumb');

        function loadCategory(catName) {
            grid.innerHTML = '';
            breadcrumb.innerText = "Kategori: " + catName;
            const data = database[catName];
            
            if(!data) return;

            // Generate 3 Kolom Sub-Kategori
            data.forEach((subCat, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => loadSubCategory(catName, index);
                
                card.innerHTML = `
                    <img src="${subCat.cover}" alt="${subCat.name}">
                    <h3>${subCat.name}</h3>
                `;
                grid.appendChild(card);
            });
        }

        function loadSubCategory(catName, subIndex) {
            grid.innerHTML = '';
            const subCat = database[catName][subIndex];
            breadcrumb.innerHTML = `<span style="cursor:pointer; color:var(--primary)" onclick="loadCategory('${catName}')">${catName}</span> > ${subCat.name}`;
            
            // Generate 3 Kolom Media
            subCat.items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                
                // Jika itu video/pdf, thumbnailnya bisa diakali pakai gambar statis, tapi untuk kesederhanaan kita pakai gambar dummy untuk covernya
                let coverImage = item.type === 'image' ? item.src : `https://picsum.photos/400/300?random=${Math.random()}`;
                if(item.type === 'pdf') coverImage = 'https://upload.wikimedia.org/wikipedia/commons/8/87/PDF_file_icon.svg';

                card.onclick = () => openMedia(item.type, item.src);
                
                card.innerHTML = `
                    <img src="${coverImage}" alt="${item.title}" style="padding: ${item.type==='pdf'?'30px':'0'}">
                    <h3 style="background:var(--primary); color:white;">${item.title} (${item.type.toUpperCase()})</h3>
                `;
                grid.appendChild(card);
            });
        }

        // ==========================================
        // BAGIAN 4: MODAL & MEDIA VIEWER
        // ==========================================
        function openModal(id) {
            document.getElementById(id).style.display = 'flex';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
            // Stop media jika modal viewer ditutup
            if(id === 'media-modal') {
                document.getElementById('media-container').innerHTML = '';
            }
        }

        function openMedia(type, src) {
            const container = document.getElementById('media-container');
            container.innerHTML = ''; // bersihkan yang sebelumnya

            if (type === 'image') {
                container.innerHTML = `<img src="${src}" alt="Fullscreen Image">`;
            } else if (type === 'video') {
                container.innerHTML = `<video controls autoplay><source src="${src}" type="video/mp4">Browsermu tidak support video.</video>`;
            } else if (type === 'pdf') {
                container.innerHTML = `<iframe src="${src}" frameborder="0"></iframe>`;
            }

            openModal('media-modal');
        }
    </script>
</body>
</html>
