<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Pop Portofolio</title>
    <style>
        /* --- TEMA RETRO POP --- */
        :root {
            --bg-color: #FFDE00;
            --pink: #FF007F;
            --cyan: #00F3FF;
            --dark: #1A1A1A;
            --font-main: 'Courier New', Courier, monospace;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--dark);
            overflow-x: hidden;
        }

        /* --- HALAMAN INTRO (PERMISI) --- */
        #intro-page {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, var(--bg-color) 0%, #ff9a00 100%);
            z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .instruction {
            font-size: 1.2rem; font-weight: bold; background: var(--dark);
            color: var(--cyan); padding: 10px 20px; border: 3px solid var(--pink);
            box-shadow: 5px 5px 0px var(--pink); margin-bottom: 30px; text-align: center;
        }

        #drop-zone {
            display: flex; gap: 10px; margin-bottom: 50px; min-height: 80px;
        }

        .slot {
            width: 60px; height: 80px; border: 3px dashed var(--dark);
            display: flex; justify-content: center; align-items: center;
            font-size: 2.5rem; font-weight: bold; color: var(--dark);
            background: rgba(255, 255, 255, 0.2);
        }

        #scatter-area {
            position: relative; width: 100%; max-width: 600px; height: 300px;
        }

        .letter {
            position: absolute; font-size: 3rem; font-weight: 900;
            cursor: pointer; user-select: none; transition: 0.2s;
            color: var(--dark);
            text-shadow: 3px 3px 0px var(--cyan), 6px 6px 0px var(--pink);
        }

        .letter:hover { transform: scale(1.2); }
        .letter.glow {
            color: #fff;
            text-shadow: 0 0 10px var(--cyan), 0 0 20px var(--pink), 0 0 30px var(--pink);
        }

        /* --- HALAMAN UTAMA --- */
        #main-page { display: none; padding: 20px; }

        header {
            text-align: center; margin-bottom: 30px;
            border-bottom: 5px solid var(--dark); padding-bottom: 20px;
        }

        h1.title {
            font-size: 3rem; color: var(--pink); text-transform: uppercase;
            text-shadow: 4px 4px 0px var(--cyan), 8px 8px 0px var(--dark);
            margin: 0;
        }

        nav { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-top: 20px; }
        nav button {
            background: var(--cyan); border: 3px solid var(--dark);
            padding: 10px 20px; font-size: 1.2rem; font-weight: bold; cursor: pointer;
            box-shadow: 4px 4px 0px var(--dark); transition: 0.1s;
        }
        nav button:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px var(--dark); }
        nav button.active-tab { background: var(--pink); color: white; }

        /* Kategori Konten (3 Kolom) */
        .category-content {
            display: none; grid-template-columns: repeat(3, 1fr); gap: 20px;
            max-width: 1200px; margin: 0 auto;
        }
        .category-content.active { display: grid; }
        
        .media-card {
            border: 4px solid var(--dark); background: #fff; height: 250px;
            box-shadow: 5px 5px 0px var(--pink); cursor: pointer;
            overflow: hidden; position: relative; transition: 0.2s;
            display: flex; justify-content: center; align-items: center; text-align: center;
        }
        .media-card:hover { transform: scale(1.02); }
        .media-card img, .media-card video { width: 100%; height: 100%; object-fit: cover; }
        .media-card .pdf-icon { font-size: 4rem; color: #ff0000; }

        /* --- SOSIAL MEDIA & ADMIN --- */
        .floating-btn {
            position: fixed; bottom: 20px; padding: 15px 25px;
            font-size: 1.2rem; font-weight: bold; border: 3px solid var(--dark);
            cursor: pointer; box-shadow: 4px 4px 0px var(--dark); z-index: 100;
        }
        #btn-social { left: 20px; background: #25D366; color: white; }
        #btn-admin { right: 20px; background: var(--cyan); color: var(--dark); }

        /* --- MODAL (VIEWER & FORM) --- */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(26, 26, 26, 0.9); z-index: 2000;
            justify-content: center; align-items: center; flex-direction: column;
        }
        .modal-content {
            background: var(--bg-color); border: 5px solid var(--dark);
            padding: 30px; max-width: 90%; max-height: 90%; text-align: center;
            box-shadow: 10px 10px 0px var(--pink); overflow-y: auto;
        }
        .close-btn {
            background: var(--pink); color: white; border: 3px solid var(--dark);
            padding: 10px 20px; font-size: 1.2rem; cursor: pointer; margin-bottom: 20px;
            box-shadow: 4px 4px 0px var(--dark);
        }

        /* Media Viewer Specifics */
        #viewer-container { width: 80vw; height: 70vh; display: flex; justify-content: center; align-items: center; }
        #viewer-container img, #viewer-container video, #viewer-container iframe {
            max-width: 100%; max-height: 100%; border: 4px solid var(--dark);
        }

        /* Form Upload Specifics */
        .upload-form { display: flex; flex-direction: column; gap: 15px; text-align: left; }
        .upload-form input, .upload-form select {
            padding: 10px; font-size: 1rem; border: 3px solid var(--dark);
        }
        .upload-form button {
            background: var(--cyan); padding: 15px; font-size: 1.2rem; font-weight: bold; border: 3px solid var(--dark); cursor: pointer;
        }

        @media (max-width: 768px) {
            .category-content { grid-template-columns: repeat(1, 1fr); }
            .slot { width: 40px; height: 60px; font-size: 1.8rem; }
            #scatter-area { height: 400px; }
            .floating-btn { font-size: 1rem; padding: 10px; }
        }
    </style>
</head>
<body>

    <div id="intro-page">
        <div class="instruction">KLIK HURUF UNTUK MENYUSUN "PERMISI"</div>
        <div id="drop-zone">
            <div class="slot" id="slot-0"></div><div class="slot" id="slot-1"></div>
            <div class="slot" id="slot-2"></div><div class="slot" id="slot-3"></div>
            <div class="slot" id="slot-4"></div><div class="slot" id="slot-5"></div>
            <div class="slot" id="slot-6"></div>
        </div>
        <div id="scatter-area"></div>
    </div>

    <div id="main-page">
        <header>
            <h1 class="title">RETRO POP HUB</h1>
            <nav>
                <button class="tab-btn active-tab" onclick="openTab('Fotografi')">Fotografi</button>
                <button class="tab-btn" onclick="openTab('Video')">Video</button>
                <button class="tab-btn" onclick="openTab('Desain')">Desain</button>
                <button class="tab-btn" onclick="openTab('3DDesain')">3D Desain</button>
            </nav>
        </header>

        <main id="content-area">
            <div id="Fotografi" class="category-content active"></div>
            <div id="Video" class="category-content"></div>
            <div id="Desain" class="category-content"></div>
            <div id="3DDesain" class="category-content"></div>
        </main>

        <button id="btn-social" class="floating-btn" onclick="document.getElementById('modal-social').style.display='flex'">Sosial Media & WA</button>
        <button id="btn-admin" class="floating-btn" onclick="document.getElementById('modal-admin').style.display='flex'">Upload (Admin)</button>
    </div>

    <div id="modal-social" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="document.getElementById('modal-social').style.display='none'">CLOSE</button>
            <h2>Kontak Saya</h2>
            <div style="display:flex; flex-direction:column; gap:10px;">
                <a href="https://wa.me/6280000000000" target="_blank" style="background:#25D366; color:white; padding:15px; text-decoration:none; font-weight:bold; border:3px solid var(--dark);">WhatsApp</a>
                <a href="https://instagram.com/username" target="_blank" style="background:#E1306C; color:white; padding:15px; text-decoration:none; font-weight:bold; border:3px solid var(--dark);">Instagram</a>
                <a href="https://twitter.com/username" target="_blank" style="background:#1DA1F2; color:white; padding:15px; text-decoration:none; font-weight:bold; border:3px solid var(--dark);">Twitter / X</a>
            </div>
        </div>
    </div>

    <div id="modal-admin" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="document.getElementById('modal-admin').style.display='none'">CLOSE</button>
            <h2>Upload Media (Local Storage)</h2>
            <div class="upload-form">
                <label>Pilih Kategori:</label>
                <select id="upload-category">
                    <option value="Fotografi">Fotografi</option>
                    <option value="Video">Video</option>
                    <option value="Desain">Desain</option>
                    <option value="3DDesain">3D Desain</option>
                </select>
                <label>Pilih File (Gambar, Video, atau PDF):</label>
                <input type="file" id="upload-file" accept="image/*,video/*,application/pdf">
                <button onclick="handleUpload()">UPLOAD SEKARANG</button>
                <small style="color:red; font-weight:bold;">*Maks file 2MB untuk menghindari limit Local Storage browser.</small>
            </div>
        </div>
    </div>

    <div id="modal-viewer" class="modal">
        <div class="modal-content" style="background:transparent; border:none; box-shadow:none;">
            <button class="close-btn" onclick="closeViewer()">CLOSE VIEWER</button>
            <div id="viewer-container"></div>
        </div>
    </div>

    <script>
        /* ===============================
           1. SISTEM INTRO "PERMISI"
        ================================== */
        const targetWord = "PERMISI";
        let currentIndex = 0;
        const scatterArea = document.getElementById('scatter-area');
        
        // Setup Audio Context untuk Bunyi Gitar (Synth)
        let audioCtx;
        function playGuitarSound(freq) {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle'; // Suara mirip petikan
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
            osc.stop(audioCtx.currentTime + 0.8);
        }

        // Frekuensi nada untuk masing-masing huruf (Tangga nada C Mayor)
        const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88]; 
        const lettersObj = targetWord.split('').map((char, i) => ({ char, freq: notes[i] }));
        
        // Acak posisi huruf
        lettersObj.sort(() => Math.random() - 0.5).forEach((item, index) => {
            let el = document.createElement('div');
            el.className = 'letter';
            el.innerText = item.char;
            // Posisi acak di dalam area
            el.style.left = Math.floor(Math.random() * 80) + '%';
            el.style.top = Math.floor(Math.random() * 80) + '%';
            
            el.onclick = function() {
                if(this.classList.contains('glow')) return; // Sudah diklik
                
                // Cek apakah huruf yang diklik sesuai urutan PERMISI
                if(this.innerText === targetWord[currentIndex]) {
                    this.classList.add('glow');
                    playGuitarSound(item.freq);
                    
                    // Pindahkan huruf ke slot
                    const slot = document.getElementById('slot-' + currentIndex);
                    slot.innerText = this.innerText;
                    this.style.display = 'none'; // Sembunyikan yang di area acak
                    
                    currentIndex++;
                    
                    // Jika selesai
                    if(currentIndex === targetWord.length) {
                        setTimeout(() => {
                            document.getElementById('intro-page').style.display = 'none';
                            document.getElementById('main-page').style.display = 'block';
                            loadContent(); // Load data dari local storage
                        }, 1000);
                    }
                } else {
                    // Bunyi salah (low pitch)
                    playGuitarSound(100);
                    // Efek getar salah (animasi css inline)
                    this.style.transform = "translateX(10px)";
                    setTimeout(() => this.style.transform = "translateX(0)", 150);
                }
            };
            scatterArea.appendChild(el);
        });

        /* ===============================
           2. SISTEM TAB KATEGORI
        ================================== */
        function openTab(categoryName) {
            // Sembunyikan semua konten
            document.querySelectorAll('.category-content').forEach(tab => {
                tab.classList.remove('active');
            });
            // Reset warna tombol
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active-tab');
            });
            
            // Tampilkan yang dipilih
            document.getElementById(categoryName).classList.add('active');
            event.target.classList.add('active-tab');
        }

        /* ===============================
           3. SISTEM UPLOAD & RENDER (LOCAL STORAGE)
        ================================== */
        // Struktur Data: { Fotografi: [{type: 'image', src: 'base64...'}], Video: [...], ... }
        
        function handleUpload() {
            const category = document.getElementById('upload-category').value;
            const fileInput = document.getElementById('upload-file');
            
            if(fileInput.files.length === 0) {
                alert("Pilih file terlebih dahulu!"); return;
            }
            
            const file = fileInput.files[0];
            const reader = new FileReader();
            
            reader.onload = function(e) {
                const base64Data = e.target.result;
                let fileType = 'image';
                if(file.type.startsWith('video')) fileType = 'video';
                else if(file.type === 'application/pdf') fileType = 'pdf';

                const newItem = { type: fileType, src: base64Data };
                
                // Ambil data lama
                let storedData = JSON.parse(localStorage.getItem('retroPopData')) || { Fotografi: [], Video: [], Desain: [], "3DDesain": [] };
                storedData[category].push(newItem);
                
                try {
                    localStorage.setItem('retroPopData', JSON.stringify(storedData));
                    alert("Berhasil diupload!");
                    document.getElementById('modal-admin').style.display = 'none';
                    fileInput.value = ''; // reset
                    loadContent(); // Refresh grid
                } catch(e) {
                    alert("Gagal menyimpan! Memori Local Storage penuh. Ukuran file terlalu besar.");
                }
            };
            reader.readAsDataURL(file); // Convert file ke Base64 (Teks)
        }

        function loadContent() {
            const storedData = JSON.parse(localStorage.getItem('retroPopData')) || { Fotografi: [], Video: [], Desain: [], "3DDesain": [] };
            
            for(const [category, items] of Object.entries(storedData)) {
                const container = document.getElementById(category);
                container.innerHTML = ''; // Bersihkan dulu
                
                items.forEach((item, index) => {
                    const card = document.createElement('div');
                    card.className = 'media-card';
                    card.onclick = () => openViewer(item.type, item.src);
                    
                    if(item.type === 'image') {
                        card.innerHTML = `<img src="${item.src}" alt="img">`;
                    } else if(item.type === 'video') {
                        card.innerHTML = `<video src="${item.src}" muted></video>`;
                    } else if(item.type === 'pdf') {
                        card.innerHTML = `<div class="pdf-icon">📄<br><span style="font-size:1rem; color:#111">PDF</span></div>`;
                    }
                    container.appendChild(card);
                });
            }
        }

        /* ===============================
           4. SISTEM PENAMPIL MEDIA (VIEWER)
        ================================== */
        function openViewer(type, src) {
            const viewerContainer = document.getElementById('viewer-container');
            viewerContainer.innerHTML = ''; // Bersihkan
            
            if(type === 'image') {
                viewerContainer.innerHTML = `<img src="${src}" alt="Full Image">`;
            } else if(type === 'video') {
                viewerContainer.innerHTML = `<video src="${src}" controls autoplay></video>`;
            } else if(type === 'pdf') {
                viewerContainer.innerHTML = `<iframe src="${src}" width="100%" height="100%"></iframe>`;
            }
            
            document.getElementById('modal-viewer').style.display = 'flex';
        }

        function closeViewer() {
            document.getElementById('viewer-container').innerHTML = ''; // Hentikan video/audio
            document.getElementById('modal-viewer').style.display = 'none';
        }

    </script>
</body>
</html>
