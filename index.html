<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Pop Portofolio</title>
    <style>
        /* === TEMA RETRO POP CSS === */
        :root {
            --bg-color: #120424;
            --neon-pink: #ff007a;
            --neon-cyan: #00f0ff;
            --neon-yellow: #fffb00;
            --font-main: 'Courier New', Courier, monospace;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--bg-color);
            color: white;
            font-family: var(--font-main);
            overflow-x: hidden;
        }

        /* --- INTRO SCREEN --- */
        #intro-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        
        #target-box {
            display: flex; gap: 10px; min-height: 80px; margin-top: 50px;
            border-bottom: 2px dashed var(--neon-cyan); padding-bottom: 10px;
            width: 300px; justify-content: center; align-items: flex-end;
        }

        .scattered-letter {
            position: absolute; font-size: 3rem; font-weight: bold; cursor: pointer;
            color: transparent; -webkit-text-stroke: 2px var(--neon-pink);
            transition: all 0.3s ease; user-select: none;
        }

        .scattered-letter:hover {
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink);
        }

        .placed-letter {
            position: relative; font-size: 4rem; font-weight: bold;
            color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan), 0 0 30px var(--neon-cyan);
            animation: pop 0.3s ease;
        }

        @keyframes pop { 0% { transform: scale(0.5); } 100% { transform: scale(1); } }

        /* --- MAIN WEBSITE --- */
        #main-site { display: none; padding: 20px; max-width: 1200px; margin: auto; }
        
        header { text-align: center; margin-bottom: 40px; }
        header h1 {
            font-size: 3rem; color: var(--neon-yellow); text-transform: uppercase;
            text-shadow: 3px 3px 0px var(--neon-pink), -2px -2px 0px var(--neon-cyan);
            letter-spacing: 5px;
        }

        /* Menu Navigasi */
        nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 15px; margin-bottom: 30px; }
        .nav-btn {
            background: transparent; color: var(--neon-cyan);
            border: 2px solid var(--neon-cyan); padding: 10px 20px;
            font-size: 1.2rem; font-family: var(--font-main); font-weight: bold;
            cursor: pointer; transition: 0.3s; text-transform: uppercase;
        }
        .nav-btn:hover, .nav-btn.active {
            background: var(--neon-cyan); color: var(--bg-color);
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        .nav-btn.btn-sosmed { border-color: var(--neon-pink); color: var(--neon-pink); }
        .nav-btn.btn-sosmed:hover { background: var(--neon-pink); color: white; box-shadow: 0 0 15px var(--neon-pink); }

        /* Kategori & Grid 3 Kolom */
        .category-section { display: none; }
        .category-section.active { display: block; animation: fadeIn 0.5s ease; }
        
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 KOLOM SESUAI PERMINTAAN */
            gap: 20px;
        }

        .grid-item {
            background: #2a0a4a; border: 2px solid var(--neon-pink);
            height: 250px; display: flex; justify-content: center; align-items: center;
            cursor: pointer; overflow: hidden; position: relative; transition: 0.3s;
        }
        .grid-item:hover { box-shadow: 0 0 20px var(--neon-pink); transform: scale(1.02); }
        .grid-item img, .grid-item video { width: 100%; height: 100%; object-fit: cover; }
        .grid-item .overlay-text {
            position: absolute; background: rgba(0,0,0,0.7); width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; transition: 0.3s; font-size: 1.5rem; color: var(--neon-yellow);
        }
        .grid-item:hover .overlay-text { opacity: 1; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- MODAL MEDIA VIEWER --- */
        #media-modal, #sosmed-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(18, 4, 36, 0.95); z-index: 10000;
            justify-content: center; align-items: center; flex-direction: column;
        }
        .modal-content {
            width: 80%; max-width: 900px; height: 80%; max-height: 600px;
            border: 3px solid var(--neon-cyan); box-shadow: 0 0 30px var(--neon-cyan);
            background: #000; display: flex; justify-content: center; align-items: center;
        }
        .modal-content img, .modal-content video, .modal-content iframe {
            width: 100%; height: 100%; object-fit: contain; border: none;
        }
        .close-btn {
            position: absolute; top: 20px; right: 40px; font-size: 3rem; color: var(--neon-pink);
            cursor: pointer; text-shadow: 0 0 10px var(--neon-pink); transition: 0.2s;
        }
        .close-btn:hover { transform: scale(1.2); color: white; }

        /* Modal Sosmed Khusus */
        .sosmed-box {
            background: #2a0a4a; padding: 40px; border: 3px solid var(--neon-yellow);
            text-align: center; box-shadow: 0 0 30px var(--neon-yellow);
        }
        .sosmed-box a {
            display: block; margin: 15px 0; color: white; text-decoration: none; font-size: 1.5rem;
            border: 1px solid var(--neon-cyan); padding: 10px; transition: 0.3s;
        }
        .sosmed-box a:hover { background: var(--neon-cyan); color: #000; }

        /* Responsive untuk layar kecil */
        @media (max-width: 768px) {
            .grid-container { grid-template-columns: 1fr; } /* Menumpuk di HP agar tidak hancur */
        }
    </style>
</head>
<body>

    <div id="intro-screen">
        <h2 style="color: var(--neon-yellow); text-shadow: 0 0 10px var(--neon-yellow); margin-bottom: 20px; text-align:center;">Susun kata 'PERMISI' untuk masuk</h2>
        <div id="target-box"></div>
    </div>

    <div id="main-site">
        <header>
            <h1>Opang Darmawan</h1>
        </header>

        <nav>
            <button class="nav-btn active" onclick="showCategory('fotografi')">Fotografi</button>
            <button class="nav-btn" onclick="showCategory('video')">Video</button>
            <button class="nav-btn" onclick="showCategory('desain')">Desain</button>
            <button class="nav-btn" onclick="showCategory('3d-desain')">3D Desain</button>
            <button class="nav-btn btn-sosmed" onclick="openSosmed()">Kontak & Sosmed</button>
        </nav>

        <div id="fotografi" class="category-section active">
            <div class="grid-container">
                <div class="grid-item" onclick="openMedia('Image_2aiu2b2aiu2b2aiub.jpg')">
                    <img src="Image_2aiu2b2aiu2b2aiub.jpg" alt="Foto 1">
                    <img src="IImage_brzrz9brzrz9brzrd.jpg" alt="Foto 2">
                    <div class="overlay-text">Foto Ai</div>
                </div>
                <div class="grid-item" onclick="openMedia('image', 'https://picsum.photos/800/600?random=2')">
                    <img src="https://picsum.photos/400/300?random=2" alt="Foto 2">
                    <div class="overlay-text">Foto Kamera</div>
                </div>
                <div class="grid-item" onclick="openMedia('image', 'https://picsum.photos/800/600?random=3')">
                    <img src="https://picsum.photos/400/300?random=3" alt="Foto 3">
                    <div class="overlay-text">Foto 360o</div>
                </div>
            </div>
        </div>

        <div id="video" class="category-section">
            <div class="grid-container">
                <div class="grid-item" onclick="openMedia('video', 'https://www.w3schools.com/html/mov_bbb.mp4')">
                    <video src="https://www.w3schools.com/html/mov_bbb.mp4" muted loop></video>
                    <div class="overlay-text">Putar Video</div>
                </div>
                <div class="grid-item" onclick="openMedia('video', 'https://www.w3schools.com/html/mov_bbb.mp4')">
                    <video src="https://www.w3schools.com/html/mov_bbb.mp4" muted loop></video>
                    <div class="overlay-text">Putar Video</div>
                </div>
                <div class="grid-item" onclick="openMedia('video', 'https://www.w3schools.com/html/mov_bbb.mp4')">
                    <video src="https://www.w3schools.com/html/mov_bbb.mp4" muted loop></video>
                    <div class="overlay-text">Putar Video</div>
                </div>
            </div>
        </div>

        <div id="desain" class="category-section">
            <div class="grid-container">
                <div class="grid-item" onclick="openMedia('pdf', 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf')">
                    <div style="text-align: center; color: var(--neon-pink); font-size: 2rem;">PDF Portfolio</div>
                    <div class="overlay-text">Buka PDF</div>
                </div>
                <div class="grid-item" onclick="openMedia('image', 'https://picsum.photos/800/600?random=4')">
                    <img src="https://picsum.photos/400/300?random=4" alt="Desain 1">
                    <div class="overlay-text">Lihat Desain</div>
                </div>
                <div class="grid-item" onclick="openMedia('image', 'https://picsum.photos/800/600?random=5')">
                    <img src="https://picsum.photos/400/300?random=5" alt="Desain 2">
                    <div class="overlay-text">Lihat Desain</div>
                </div>
            </div>
        </div>

        <div id="3d-desain" class="category-section">
            <div class="grid-container">
                <div class="grid-item" onclick="openMedia('image', 'https://picsum.photos/800/600?random=6')">
                    <img src="https://picsum.photos/400/300?random=6" alt="3D 1">
                    <div class="overlay-text">Lihat 3D</div>
                </div>
                <div class="grid-item" onclick="openMedia('image', 'https://picsum.photos/800/600?random=7')">
                    <img src="https://picsum.photos/400/300?random=7" alt="3D 2">
                    <div class="overlay-text">Lihat 3D</div>
                </div>
                <div class="grid-item" onclick="openMedia('image', 'https://picsum.photos/800/600?random=8')">
                    <img src="https://picsum.photos/400/300?random=8" alt="3D 3">
                    <div class="overlay-text">Lihat 3D</div>
                </div>
            </div>
        </div>
    </div>

    <div id="media-modal">
        <span class="close-btn" onclick="closeModal('media-modal')">&times;</span>
        <div class="modal-content" id="media-content">
            </div>
    </div>

    <div id="sosmed-modal">
        <span class="close-btn" onclick="closeModal('sosmed-modal')">&times;</span>
        <div class="sosmed-box">
            <h2 style="color: var(--neon-pink); margin-top:0;">HUBUNGI SAYA</h2>
            <a href="https://wa.me/628000000000" target="_blank">WhatsApp</a>
            <a href="https://instagram.com" target="_blank">Instagram</a>
            <a href="https://behance.net" target="_blank">Behance</a>
        </div>
    </div>

    <script>
        /* === LOGIKA AUDIO SYNTH GITAR === */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playGuitar(frequency) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle'; // Suara pluck mirip retro synth/gitar
            osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        /* === LOGIKA INTRO 'PERMISI' === */
        const wordToSpell = "PERMISI";
        const freqs = [329.63, 349.23, 392.00, 440.00, 493.88, 523.25, 587.33]; // Frekuensi nada (E4 ke D5)
        let currentIndex = 0;
        const introScreen = document.getElementById('intro-screen');
        const targetBox = document.getElementById('target-box');
        let letterElements = [];

        function initIntro() {
            targetBox.innerHTML = '';
            const letters = wordToSpell.split('');
            // Acak urutan huruf untuk ditampilkan di layar
            const shuffled = [...letters].sort(() => Math.random() - 0.5);
            
            // Hapus yang lama jika ada (saat reset)
            letterElements.forEach(el => el.remove());
            letterElements = [];

            shuffled.forEach((char) => {
                const span = document.createElement('span');
                span.innerText = char;
                span.className = 'scattered-letter';
                
                // Posisi acak di layar (batas 10% hingga 80% agar tidak keluar layar)
                span.style.top = Math.floor(Math.random() * 70 + 10) + '%';
                span.style.left = Math.floor(Math.random() * 70 + 10) + '%';
                
                span.onclick = () => handleLetterClick(span, char);
                introScreen.appendChild(span);
                letterElements.push(span);
            });
        }

        function handleLetterClick(element, char) {
            // Cek apakah huruf yang diklik sesuai urutan 'PERMISI'
            if (char === wordToSpell[currentIndex]) {
                playGuitar(freqs[currentIndex]); // Mainkan nada
                
                // Pindahkan ke kotak bawah
                element.className = 'placed-letter';
                element.style.top = 'auto';
                element.style.left = 'auto';
                element.onclick = null; // Nonaktifkan klik
                targetBox.appendChild(element);
                
                currentIndex++;
                
                // Jika sudah komplit, masuk ke website utama
                if (currentIndex === wordToSpell.length) {
                    setTimeout(() => {
                        introScreen.style.display = 'none';
                        document.getElementById('main-site').style.display = 'block';
                    }, 800);
                }
            } else {
                // Jika salah urutan, mainkan nada rendah & reset
                playGuitar(150);
                targetBox.style.borderColor = 'red';
                setTimeout(() => {
                    targetBox.style.borderColor = 'var(--neon-cyan)';
                    currentIndex = 0;
                    initIntro();
                }, 400);
            }
        }

        /* === LOGIKA MENU KATEGORI === */
        function showCategory(categoryId) {
            // Sembunyikan semua kategori
            document.querySelectorAll('.category-section').forEach(sec => sec.classList.remove('active'));
            // Hapus class active dari semua tombol
            document.querySelectorAll('nav .nav-btn').forEach(btn => btn.classList.remove('active'));
            
            // Tampilkan yang dipilih
            document.getElementById(categoryId).classList.add('active');
            event.target.classList.add('active');
        }

        /* === LOGIKA MEDIA VIEWER & MODAL === */
        const mediaModal = document.getElementById('media-modal');
        const mediaContent = document.getElementById('media-content');
        const sosmedModal = document.getElementById('sosmed-modal');

        function openMedia(type, url) {
            mediaContent.innerHTML = ''; // Bersihkan kontainer
            if (type === 'image') {
                mediaContent.innerHTML = `<img src="${url}" alt="Full Media">`;
            } else if (type === 'video') {
                mediaContent.innerHTML = `<video src="${url}" controls autoplay></video>`;
            } else if (type === 'pdf') {
                mediaContent.innerHTML = `<iframe src="${url}"></iframe>`;
            }
            mediaModal.style.display = 'flex';
        }

        function openSosmed() {
            sosmedModal.style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
            if (modalId === 'media-modal') {
                mediaContent.innerHTML = ''; // Matikan video/audio saat ditutup
            }
        }

        // Jalankan intro saat pertama kali dimuat
        window.onload = initIntro;
    </script>
</body>
</html>
