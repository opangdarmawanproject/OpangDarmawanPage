<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Pop Portfolio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Righteous&family=Space+Mono:wght@400;700&display=swap');

        :root {
            --pink: #FF007F;
            --cyan: #00FFFF;
            --yellow: #FFD700;
            --black: #111111;
            --white: #FFFFFF;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Space Mono', monospace;
            background-color: var(--black);
            color: var(--black);
            overflow-x: hidden;
            background-image: radial-gradient(var(--cyan) 2px, transparent 2px);
            background-size: 30px 30px;
        }

        h1, h2, h3, .brand {
            font-family: 'Righteous', cursive;
        }

        /* --- HALAMAN INTRO (GAME PERMISI) --- */
        #intro-stage {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100vh;
            background-color: var(--black);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            text-align: center;
            transition: opacity 1s ease;
        }

        .intro-title {
            color: var(--yellow);
            text-shadow: 4px 4px 0px var(--pink);
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .slots-container, .scrambled-container {
            display: flex;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .slot {
            width: 50px; height: 70px;
            border: 3px dashed var(--cyan);
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; font-weight: bold; font-family: 'Righteous', cursive;
            color: var(--white); background: rgba(0,0,0,0.5);
            cursor: pointer;
        }

        .letter {
            width: 50px; height: 70px;
            background-color: var(--pink);
            border: 3px solid var(--white);
            box-shadow: 4px 4px 0px var(--cyan);
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; font-weight: bold; font-family: 'Righteous', cursive;
            color: var(--white);
            cursor: pointer;
            transition: all 0.2s;
        }

        .letter:hover {
            transform: translate(-2px, -2px);
            box-shadow: 0 0 15px var(--yellow), 0 0 30px var(--pink); /* Efek Bercahaya */
            color: var(--yellow);
        }

        /* --- HALAMAN UTAMA --- */
        #main-site {
            display: none;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background-color: var(--pink);
            padding: 20px;
            border: 4px solid var(--black);
            box-shadow: 8px 8px 0px var(--yellow);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
        }

        header h1 {
            color: var(--white);
            text-shadow: 3px 3px 0px var(--black);
            margin: 0 0 20px 0;
            font-size: 3rem;
        }

        nav {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-btn {
            background-color: var(--cyan);
            border: 3px solid var(--black);
            padding: 10px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--black);
            transition: 0.1s;
        }

        .nav-btn:hover { background-color: var(--yellow); }
        .nav-btn:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px var(--black); }

        /* Grid Kategori (3 Kolom) */
        .content-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 50px;
        }

        .grid-item {
            background: var(--white);
            border: 4px solid var(--black);
            box-shadow: 8px 8px 0px var(--cyan);
            padding: 20px;
            text-align: center;
        }

        .grid-item h3 { margin-top: 0; color: var(--pink); }
        
        .view-btn {
            background: var(--yellow); border: 3px solid var(--black);
            padding: 10px; font-weight: bold; cursor: pointer;
            box-shadow: 3px 3px 0px var(--black); width: 100%;
        }
        .view-btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--black); }

        @media (max-width: 768px) {
            .content-grid { grid-template-columns: 1fr; }
        }

        /* --- FITUR SOSIAL & WHATSAPP --- */
        #social-fab-container {
            position: fixed; bottom: 30px; right: 30px; z-index: 500;
        }
        #social-menu {
            display: none; flex-direction: column; gap: 10px; margin-bottom: 10px;
        }
        .social-btn {
            background: var(--pink); color: white; border: 3px solid var(--black);
            padding: 10px; font-weight: bold; text-align: center; cursor: pointer;
            box-shadow: 4px 4px 0px var(--black); text-decoration: none;
        }
        .social-btn.wa { background: #25D366; }
        .main-fab {
            background: var(--yellow); border: 4px solid var(--black); padding: 15px 20px;
            font-size: 1.2rem; font-weight: bold; cursor: pointer; box-shadow: 5px 5px 0px var(--black);
        }

        /* --- PENAMPIL MEDIA (FULLSCREEN VIEWER) --- */
        #media-viewer {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background: rgba(17, 17, 17, 0.95); z-index: 9999;
            flex-direction: column; align-items: center; justify-content: center;
        }
        #close-viewer {
            position: absolute; top: 20px; right: 30px; background: var(--pink);
            color: white; border: 3px solid white; font-size: 2rem; width: 50px; height: 50px;
            cursor: pointer; box-shadow: 3px 3px 0px var(--cyan); font-family: 'Righteous';
        }
        #viewer-content { width: 90%; height: 80%; display: flex; justify-content: center; align-items: center; }
        #viewer-content img, #viewer-content iframe, #viewer-content video {
            max-width: 100%; max-height: 100%; border: 5px solid var(--yellow); box-shadow: 10px 10px 0px var(--cyan); background: white;
        }
    </style>
</head>
<body>

    <div id="intro-stage">
        <h2 class="intro-title">SUSUN HURUF UNTUK MASUK!</h2>
        <div id="drop-slots" class="slots-container">
            </div>
        <div id="scrambled-letters" class="scrambled-container">
            </div>
    </div>

    <div id="main-site">
        <header>
            <h1>STUDIO KREATIF</h1>
            <nav>
                <button class="nav-btn" onclick="loadCategory('Fotografi')">Fotografi</button>
                <button class="nav-btn" onclick="loadCategory('Video')">Video</button>
                <button class="nav-btn" onclick="loadCategory('Desain')">Desain</button>
                <button class="nav-btn" onclick="loadCategory('3D Desain')">3D Desain</button>
            </nav>
        </header>

        <h2 id="category-title" style="color:var(--white); text-shadow: 2px 2px 0px var(--pink); background:var(--black); display:inline-block; padding:10px;">Fotografi</h2>
        <div id="content-grid" class="content-grid">
            </div>

        <div id="social-fab-container">
            <div id="social-menu">
                <a href="#" class="social-btn wa">WhatsApp</a>
                <a href="#" class="social-btn">Instagram</a>
                <a href="#" class="social-btn">Twitter/X</a>
            </div>
            <button class="main-fab" onclick="toggleSocial()">💬 HUBUNGI</button>
        </div>
    </div>

    <div id="media-viewer">
        <button id="close-viewer" onclick="closeViewer()">X</button>
        <div id="viewer-content"></div>
    </div>

    <script>
        /* --- LOGIKA AUDIO GITAR SYNTH --- */
        // Menghasilkan bunyi seperti petikan gitar tanpa butuh file audio eksternal.
        function playGuitarSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'triangle'; 
                // Nada acak untuk efek musikal saat klik
                const notes = [329.63, 392.00, 440.00, 493.88, 659.25, 783.99]; 
                osc.frequency.value = notes[Math.floor(Math.random() * notes.length)];
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                
                // Efek fade out cepat khas petikan gitar
                gain.gain.setValueAtTime(1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
                osc.stop(ctx.currentTime + 0.8);
            } catch(e) { console.log("Web Audio API tidak didukung di browser ini."); }
        }

        /* --- LOGIKA GAME 'PERMISI' --- */
        let targetWord = "PERMISI".split('');
        let currentSlots = [null, null, null, null, null, null, null];
        
        // Huruf diacak
        let lettersPool = [
            { id: 1, char: 'S' }, { id: 2, char: 'I' }, { id: 3, char: 'P' },
            { id: 4, char: 'M' }, { id: 5, char: 'R' }, { id: 6, char: 'I' }, { id: 7, char: 'E' }
        ];

        function renderGame() {
            const slotsDiv = document.getElementById('drop-slots');
            const poolDiv = document.getElementById('scrambled-letters');
            
            slotsDiv.innerHTML = '';
            poolDiv.innerHTML = '';

            // Render Slots
            currentSlots.forEach((item, index) => {
                const slot = document.createElement('div');
                slot.className = 'slot';
                if(item) {
                    slot.innerText = item.char;
                    slot.style.border = '3px solid var(--yellow)';
                    slot.onclick = () => returnLetter(index);
                }
                slotsDiv.appendChild(slot);
            });

            // Render Kolam Huruf Acak
            lettersPool.forEach(item => {
                const letter = document.createElement('div');
                letter.className = 'letter';
                letter.innerText = item.char;
                letter.onclick = () => selectLetter(item.id);
                poolDiv.appendChild(letter);
            });
        }

        function selectLetter(id) {
            playGuitarSound(); // Bunyi Gitar!
            let emptyIndex = currentSlots.findIndex(s => s === null);
            if(emptyIndex !== -1) {
                let lObj = lettersPool.find(l => l.id === id);
                currentSlots[emptyIndex] = lObj;
                lettersPool = lettersPool.filter(l => l.id !== id);
                renderGame();
                checkWinCondition();
            }
        }

        function returnLetter(index) {
            if(currentSlots[index]) {
                playGuitarSound();
                lettersPool.push(currentSlots[index]);
                currentSlots[index] = null;
                renderGame();
            }
        }

        function checkWinCondition() {
            let currentStr = currentSlots.map(s => s ? s.char : '').join('');
            if(currentStr === "PERMISI") {
                // Berhasil!
                setTimeout(() => {
                    playGuitarSound(); playGuitarSound(); // Bunyi chord ganda saat masuk
                    document.getElementById('intro-stage').style.opacity = '0';
                    setTimeout(() => {
                        document.getElementById('intro-stage').style.display = 'none';
                        document.getElementById('main-site').style.display = 'block';
                        loadCategory('Fotografi'); // Muat kategori default
                    }, 1000);
                }, 500);
            }
        }

        // Inisialisasi Game
        renderGame();


        /* --- LOGIKA KONTEN & KATEGORI --- */
        // Data Dummy untuk masing-masing kategori
        const contentDB = {
            'Fotografi': [
                { type: 'img', src: 'https://picsum.photos/id/1015/1200/800', title: 'Koleksi Lanskap' },
                { type: 'img', src: 'https://picsum.photos/id/1016/1200/800', title: 'Sesi Potret' },
                { type: 'img', src: 'https://picsum.photos/id/1018/1200/800', title: 'Fotografi Jalanan' }
            ],
            'Video': [
                { type: 'video', src: 'https://www.w3schools.com/html/mov_bbb.mp4', title: 'Klip Komersial' },
                { type: 'video', src: 'https://www.w3schools.com/html/mov_bbb.mp4', title: 'Video Musik' },
                { type: 'video', src: 'https://www.w3schools.com/html/mov_bbb.mp4', title: 'Dokumenter Pendek' }
            ],
            'Desain': [
                { type: 'img', src: 'https://picsum.photos/id/1025/1200/800', title: 'Desain Logo' },
                // Dummy PDF W3C
                { type: 'pdf', src: 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf', title: 'Buku Panduan (PDF)' }, 
                { type: 'img', src: 'https://picsum.photos/id/1027/1200/800', title: 'Poster Kampanye' }
            ],
            '3D Desain': [
                { type: 'img', src: 'https://picsum.photos/id/1031/1200/800', title: 'Render Karakter 3D' },
                { type: 'img', src: 'https://picsum.photos/id/1032/1200/800', title: 'Arsitektur 3D' },
                { type: 'video', src: 'https://www.w3schools.com/html/mov_bbb.mp4', title: 'Animasi 3D' }
            ]
        };

        function loadCategory(categoryName) {
            document.getElementById('category-title').innerText = categoryName;
            const grid = document.getElementById('content-grid');
            grid.innerHTML = ''; // Bersihkan kontainer
            
            contentDB[categoryName].forEach(item => {
                const div = document.createElement('div');
                div.className = 'grid-item';
                div.innerHTML = `
                    <h3>${item.title}</h3>
                    <p style="font-size:0.8rem; color:var(--pink);">Format: ${item.type.toUpperCase()}</p>
                    <button class="view-btn" onclick="openViewer('${item.type}', '${item.src}')">Lihat Layar Penuh</button>
                `;
                grid.appendChild(div);
            });
        }

        /* --- LOGIKA SOSIAL MEDIA --- */
        function toggleSocial() {
            const menu = document.getElementById('social-menu');
            menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
        }

        /* --- LOGIKA PENAMPIL MEDIA --- */
        function openViewer(type, src) {
            const viewer = document.getElementById('media-viewer');
            const content = document.getElementById('viewer-content');
            viewer.style.display = 'flex';
            content.innerHTML = ''; // Bersihkan penampil

            if (type === 'img') {
                content.innerHTML = `<img src="${src}" alt="Full Screen Image">`;
            } else if (type === 'video') {
                content.innerHTML = `<video controls autoplay style="width:100%; height:100%;"><source src="${src}" type="video/mp4"></video>`;
            } else if (type === 'pdf') {
                content.innerHTML = `<iframe src="${src}" style="width:100%; height:100%; border:none;"></iframe>`;
            }
        }

        function closeViewer() {
            const viewer = document.getElementById('media-viewer');
            const content = document.getElementById('viewer-content');
            viewer.style.display = 'none';
            content.innerHTML = ''; // Hentikan video/audio saat ditutup
        }
    </script>
</body>
</html>
