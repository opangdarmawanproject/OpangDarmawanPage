<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Pop Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* --- TEMA RETRO POP (MEMPHIS STYLE) --- */
        :root {
            --pink: #ff007f;
            --cyan: #00f3ff;
            --yellow: #ffd000;
            --black: #111111;
            --white: #ffffff;
            --bg: #f4f4fa;
        }

        body {
            margin: 0;
            font-family: 'Space Mono', monospace;
            background-color: var(--bg);
            color: var(--black);
            overflow-x: hidden;
        }

        h1, h2, h3, h4, .retro-font {
            font-family: 'Righteous', cursive;
        }

        /* --- HALAMAN INTRO (PERMISI) --- */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--black);
            background-image: radial-gradient(var(--pink) 15%, transparent 16%), radial-gradient(var(--pink) 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        .intro-title {
            color: var(--white);
            background: var(--black);
            padding: 10px 20px;
            border: 4px solid var(--cyan);
            box-shadow: 8px 8px 0px var(--yellow);
            margin-bottom: 50px;
            text-align: center;
        }

        #scatter-container {
            position: relative;
            width: 100%;
            height: 40vh;
        }

        .scattered-letter {
            position: absolute;
            font-size: 3.5rem;
            font-family: 'Righteous', cursive;
            color: var(--yellow);
            -webkit-text-stroke: 2px var(--black);
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            text-shadow: 4px 4px 0px var(--pink);
        }

        .scattered-letter:hover {
            transform: scale(1.2) rotate(5deg);
        }

        .scattered-letter.glow {
            color: var(--white);
            text-shadow: 0 0 20px var(--cyan), 0 0 40px var(--cyan), 4px 4px 0px var(--black);
        }

        .drop-zone {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .slot {
            width: 50px;
            height: 60px;
            background: var(--white);
            border: 4px dashed var(--cyan);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-family: 'Righteous', cursive;
            color: var(--black);
            box-shadow: 4px 4px 0px var(--black);
        }

        #reset-btn {
            margin-top: 30px;
            padding: 10px 20px;
            background: var(--pink);
            color: white;
            border: 4px solid var(--black);
            cursor: pointer;
            font-weight: bold;
            box-shadow: 4px 4px 0px var(--black);
        }

        #reset-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--black);
        }

        /* --- HALAMAN UTAMA --- */
        #main-app {
            display: none;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 40px 20px;
            background: var(--yellow);
            border: 5px solid var(--black);
            box-shadow: 10px 10px 0px var(--pink);
        }

        header h1 {
            font-size: 3rem;
            margin: 0;
            text-transform: uppercase;
        }

        /* Navigasi Kategori */
        .nav-menu {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: var(--cyan);
            border: 3px solid var(--black);
            padding: 10px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 5px 5px 0px var(--black);
            transition: 0.1s;
        }

        .nav-btn:hover {
            background: var(--white);
        }

        .nav-btn:active {
            transform: translate(5px, 5px);
            box-shadow: 0px 0px 0px var(--black);
        }

        /* Grid Portfolio */
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--white);
            border: 4px solid var(--black);
            box-shadow: 8px 8px 0px var(--black);
            padding: 15px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
            background: #fffdf0;
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border: 3px solid var(--black);
        }

        .card h3 {
            margin: 15px 0 5px 0;
            font-size: 1.5rem;
        }

        .card p {
            margin: 0;
            font-size: 0.9rem;
            color: #555;
            font-weight: bold;
        }

        /* --- SOSIAL MEDIA & WHATSAPP FLOATING --- */
        .fab-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .social-menu {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .social-btn {
            background: var(--white);
            border: 3px solid var(--black);
            padding: 10px 20px;
            text-decoration: none;
            color: var(--black);
            font-weight: bold;
            box-shadow: 4px 4px 0px var(--black);
            text-align: center;
        }

        .social-btn.wa { background: #25D366; color: white; }
        .social-btn.ig { background: var(--pink); color: white; }

        .fab {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--yellow);
            border: 4px solid var(--black);
            box-shadow: 4px 4px 0px var(--black);
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- LIGHTBOX (PENAMPIL MEDIA Penuh) --- */
        #lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(17, 17, 17, 0.95);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            background: var(--pink);
            color: white;
            border: 4px solid var(--white);
            font-size: 2rem;
            width: 50px; height: 50px;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--cyan);
        }

        #media-container {
            max-width: 90vw;
            max-height: 85vh;
            border: 5px solid var(--yellow);
            box-shadow: 10px 10px 0px var(--cyan);
            background: white;
        }

        #media-container img, #media-container video, #media-container iframe {
            width: 100%;
            height: 100%;
            max-height: 80vh;
            object-fit: contain;
            display: block;
        }

        iframe {
            width: 80vw;
            height: 80vh;
        }

    </style>
</head>
<body>

    <div id="intro-screen">
        <div class="intro-title">
            <h2 style="margin:0;">KLIK HURUF UNTUK MENYUSUN KATA</h2>
            <p style="margin:5px 0 0 0; font-size:0.8rem;">Susun menjadi "PERMISI"</p>
        </div>
        
        <div id="scatter-container">
            </div>

        <div class="drop-zone" id="slots">
            <div class="slot" id="slot-0"></div>
            <div class="slot" id="slot-1"></div>
            <div class="slot" id="slot-2"></div>
            <div class="slot" id="slot-3"></div>
            <div class="slot" id="slot-4"></div>
            <div class="slot" id="slot-5"></div>
            <div class="slot" id="slot-6"></div>
        </div>

        <button id="reset-btn" onclick="resetGame()">ULANGI</button>
    </div>

    <div id="main-app">
        <header>
            <h1>Galeri Kreatif</h1>
            <p>Selamat Datang di Portofolio Retro Pop!</p>
        </header>

        <div class="nav-menu">
            <button class="nav-btn" onclick="filterData('all')">Semua</button>
            <button class="nav-btn" onclick="filterData('fotografi')">Fotografi</button>
            <button class="nav-btn" onclick="filterData('video')">Video</button>
            <button class="nav-btn" onclick="filterData('desain')">Desain</button>
            <button class="nav-btn" onclick="filterData('3d')">3D Desain</button>
        </div>

        <div class="portfolio-grid">
            <div class="card" data-category="fotografi" onclick="openMedia('img', 'https://picsum.photos/1200/800?random=1')">
                <img src="https://picsum.photos/400/300?random=1" alt="Foto">
                <h3>Sesi Foto Urban</h3>
                <p>Fotografi</p>
            </div>
            <div class="card" data-category="video" onclick="openMedia('video', 'https://www.w3schools.com/html/mov_bbb.mp4')">
                <img src="https://picsum.photos/400/300?random=2" alt="Video">
                <h3>Video Promosi</h3>
                <p>Video</p>
            </div>
            <div class="card" data-category="desain" onclick="openMedia('pdf', 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf')">
                <img src="https://picsum.photos/400/300?random=3" alt="Desain">
                <h3>Company Profile</h3>
                <p>Desain (PDF)</p>
            </div>
            <div class="card" data-category="3d" onclick="openMedia('img', 'https://picsum.photos/1200/800?random=4')">
                <img src="https://picsum.photos/400/300?random=4" alt="3D Desain">
                <h3>Render Karakter</h3>
                <p>3D Desain</p>
            </div>
             <div class="card" data-category="fotografi" onclick="openMedia('img', 'https://picsum.photos/1200/800?random=5')">
                <img src="https://picsum.photos/400/300?random=5" alt="Foto">
                <h3>Foto Produk</h3>
                <p>Fotografi</p>
            </div>
        </div>
    </div>

    <div class="fab-container" id="fab-container" style="display:none;">
        <div class="social-menu" id="social-menu">
            <a href="https://wa.me/6281234567890" target="_blank" class="social-btn wa">WhatsApp</a>
            <a href="#" class="social-btn ig">Instagram</a>
            <a href="#" class="social-btn">Twitter / X</a>
        </div>
        <button class="fab" onclick="toggleSocial()">💬</button>
    </div>

    <div id="lightbox">
        <button class="close-btn" onclick="closeMedia()">X</button>
        <div id="media-container"></div>
    </div>

    <script>
        // --- WEB AUDIO API (Suara Gitar Synth) ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function playGuitarNote(freq) {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            // Gelombang 'triangle' menyerupai petikan senar ringan
            osc.type = 'triangle'; 
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            // Envelope (Mengatur efek petikan/memudar)
            gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 1.5);
        }

        // --- LOGIKA GAME "PERMISI" ---
        const targetWord = "PERMISI";
        // Frekuensi nada (Tangga nada pentatonik agar terdengar harmonis)
        const notes = { 'P': 329.63, 'E': 392.00, 'R': 440.00, 'M': 523.25, 'I': 587.33, 'S': 659.25, 'I2': 783.99 };
        let currentSpelling = "";
        let scatterElements = [];

        function initGame() {
            const container = document.getElementById('scatter-container');
            container.innerHTML = '';
            currentSpelling = '';
            
            // Bersihkan slot
            for(let i=0; i<7; i++) {
                document.getElementById('slot-'+i).innerText = '';
            }

            // Buat huruf berhamburan
            let letters = ['P', 'E', 'R', 'M', 'I', 'S', 'I'];
            // Acak array
            letters = letters.sort(() => Math.random() - 0.5);

            letters.forEach((char, index) => {
                let el = document.createElement('div');
                el.innerText = char;
                el.className = 'scattered-letter';
                
                // Posisi Acak
                el.style.left = Math.floor(Math.random() * 80) + 10 + '%';
                el.style.top = Math.floor(Math.random() * 80) + 10 + '%';
                
                el.onclick = () => handleLetterClick(el, char);
                container.appendChild(el);
                scatterElements.push(el);
            });
        }

        function handleLetterClick(el, char) {
            // Mainkan suara
            // Membedakan nada I pertama dan I kedua secara otomatis
            let note = notes[char];
            if (char === 'I' && currentSpelling.includes('I')) note = notes['I2'];
            playGuitarNote(note);

            // Tambah efek cahaya (glow)
            el.classList.add('glow');

            setTimeout(() => {
                // Sembunyikan huruf yang berhamburan
                el.style.display = 'none';

                // Isi ke slot berikutnya
                let slotIndex = currentSpelling.length;
                if (slotIndex < targetWord.length) {
                    document.getElementById('slot-' + slotIndex).innerText = char;
                    currentSpelling += char;
                }

                // Cek apakah sudah 7 huruf
                if (currentSpelling.length === targetWord.length) {
                    if (currentSpelling === targetWord) {
                        // BENAR! Buka Website
                        setTimeout(unlockWebsite, 500);
                    } else {
                        // SALAH! Reset
                        setTimeout(() => {
                            alert('Susunan salah, coba lagi!');
                            resetGame();
                        }, 500);
                    }
                }
            }, 200);
        }

        function resetGame() {
            initGame();
        }

        function unlockWebsite() {
            document.getElementById('intro-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('intro-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                document.getElementById('fab-container').style.display = 'flex';
            }, 500);
        }

        // Mulai Game saat pertama kali dimuat
        window.onload = initGame;


        // --- LOGIKA FILTER PORTFOLIO ---
        function filterData(category) {
            const items = document.querySelectorAll('.card');
            items.forEach(item => {
                if (category === 'all' || item.dataset.category === category) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        // --- LOGIKA SOSIAL MEDIA TOGGLE ---
        function toggleSocial() {
            const menu = document.getElementById('social-menu');
            if (menu.style.display === 'none' || menu.style.display === '') {
                menu.style.display = 'flex';
            } else {
                menu.style.display = 'none';
            }
        }

        // --- LOGIKA LIGHTBOX (Penampil Gambar, Video, PDF) ---
        function openMedia(type, url) {
            const container = document.getElementById('media-container');
            container.innerHTML = ''; // Bersihkan kontainer

            if (type === 'img') {
                container.innerHTML = `<img src="${url}" alt="Full Media">`;
            } else if (type === 'video') {
                container.innerHTML = `<video controls autoplay><source src="${url}" type="video/mp4">Browser Anda tidak mendukung video.</video>`;
            } else if (type === 'pdf') {
                container.innerHTML = `<iframe src="${url}"></iframe>`;
            }

            document.getElementById('lightbox').style.display = 'flex';
        }

        function closeMedia() {
            document.getElementById('media-container').innerHTML = ''; // Hentikan video/audio saat ditutup
            document.getElementById('lightbox').style.display = 'none';
        }
    </script>
</body>
</html>
