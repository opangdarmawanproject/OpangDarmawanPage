<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opang Darmawan - Retro Pop Portfolio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@400;600;800&display=swap');

        /* --- Global Styles --- */
        body { margin: 0; font-family: 'Poppins', sans-serif; background: #ffe6ff; overflow-x: hidden; color: #000; }
        * { box-sizing: border-box; }
        .retro-text { font-family: 'Bangers', cursive; letter-spacing: 2px; }

        /* --- Landing Page Interaktif --- */
        #landing {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #1a1a2e; z-index: 9999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; transition: opacity 0.5s ease;
        }
        #landing-instruction {
            position: absolute; top: 10%; color: #fff; font-size: 1.5rem; text-align: center;
            text-shadow: 2px 2px 0 #ff00ff; z-index: 10;
        }
        #scatter-area { position: absolute; top: 0; left: 0; width: 100%; height: 80%; overflow: hidden;}
        .scatter-letter {
            position: absolute; font-size: 5rem; font-family: 'Bangers'; color: #fff;
            cursor: pointer; user-select: none; transition: transform 0.2s ease, box-shadow 0.3s ease;
            text-shadow: 4px 4px 0 #ff00ff, -2px -2px 0 #00ffff; padding: 10px;
        }
        .scatter-letter:hover { transform: scale(1.2) rotate(10deg); }
        .scatter-letter.glow {
            color: #ffff00; text-shadow: 0 0 20px #ffff00, 4px 4px 0 #ff007f; transform: scale(1);
        }
        .shake { animation: shake 0.3s; }
        @keyframes shake {
            0% { transform: translateX(0); } 25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); } 75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }
        #word-dock {
            display: flex; gap: 15px; position: absolute; bottom: 10%; height: 100px;
            border-bottom: 5px dashed #00ffff; padding: 10px; justify-content: center; align-items: flex-end;
            min-width: 300px;
        }

        /* --- Main Website --- */
        #main-site { display: none; padding: 20px; max-width: 1200px; margin: auto; animation: fadeIn 1s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        header { text-align: center; padding: 40px 0; border-bottom: 5px solid #000; margin-bottom: 30px; }
        header h1 { font-size: 4.5rem; color: #ff007f; text-shadow: 5px 5px 0px #000, 10px 10px 0px #00ffff; margin: 0; line-height: 1; }
        header p { font-size: 1.2rem; font-weight: 600; margin-top: 10px; background: #ffff00; display: inline-block; padding: 5px 15px; border: 3px solid #000; box-shadow: 3px 3px 0 #000;}

        /* Menu / Categories */
        .nav-cats { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-bottom: 30px; }
        .nav-btn {
            background: #00ffff; border: 3px solid #000; padding: 10px 25px; font-size: 1.2rem;
            font-weight: 800; cursor: pointer; box-shadow: 5px 5px 0px #000; transition: 0.2s; text-transform: uppercase;
        }
        .nav-btn:hover { transform: translate(-3px, -3px); box-shadow: 8px 8px 0px #000; background: #ffff00; }
        .nav-btn.active { background: #ff007f; color: white; }

        /* Grid Columns */
        #back-btn { 
            display: none; background: #000; color: #fff; border: 3px solid #ff007f; padding: 10px 20px; 
            font-weight: bold; cursor: pointer; margin-bottom: 20px; box-shadow: 4px 4px 0px #00ffff; 
        }
        #back-btn:hover { background: #ff007f; }
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
        
        /* Cards */
        .card {
            background: #fff; border: 4px solid #000; padding: 15px; box-shadow: 8px 8px 0px #000;
            cursor: pointer; transition: 0.2s; text-align: center; display: flex; flex-direction: column;
        }
        .card:hover { background: #ffff00; transform: translateY(-5px); box-shadow: 10px 15px 0px #ff007f; }
        .card img { width: 100%; height: 200px; object-fit: cover; border: 3px solid #000; margin-bottom: 15px; background: #eee;}
        .card h3 { margin: 0; font-size: 1.5rem; color: #000; font-family: 'Bangers', cursive; letter-spacing: 1px; }

        /* --- Social Media & WA FAB --- */
        #social-container { position: fixed; bottom: 30px; right: 30px; z-index: 1000; display: flex; flex-direction: column-reverse; align-items: flex-end; gap: 15px; }
        .social-btn {
            width: 70px; height: 70px; border-radius: 50%; background: #00ffff; color: #000; border: 4px solid #000;
            font-size: 1rem; font-weight: bold; cursor: pointer; box-shadow: 4px 4px 0px #000;
            display: flex; justify-content: center; align-items: center; text-align: center; transition: 0.2s;
        }
        .social-btn:hover { background: #ffff00; transform: scale(1.1); }
        .social-menu { display: none; flex-direction: column; gap: 10px; }
        .social-item {
            padding: 12px 25px; background: #ff007f; border: 3px solid #000; box-shadow: 4px 4px 0px #000;
            text-decoration: none; color: #fff; font-weight: bold; border-radius: 25px; text-align: center; transition: 0.2s;
        }
        .social-item:hover { background: #000; color: #ff007f; }

        /* --- Media Viewer (Modal) --- */
        #media-modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9);
            z-index: 10000; display: none; justify-content: center; align-items: center; flex-direction: column;
        }
        #close-modal {
            position: absolute; top: 20px; right: 30px; font-size: 2rem; background: #ff007f; color: #fff;
            border: 3px solid #fff; padding: 5px 20px; cursor: pointer; font-family: 'Bangers'; box-shadow: 4px 4px 0 #00ffff; z-index: 10001;
        }
        #close-modal:hover { background: #ffff00; color: #000; }
        .media-content-container { width: 90%; height: 85%; display: flex; justify-content: center; align-items: center; position: relative; }
        .media-content-container img, .media-content-container video { max-width: 100%; max-height: 100%; border: 5px solid #fff; box-shadow: 0 0 30px #ff00ff; }
        .media-content-container iframe { width: 100%; max-width: 500px; height: 100%; border: 5px solid #fff; background: #fff; box-shadow: 0 0 30px #ff00ff;}
    </style>
</head>
<body>

    <div id="landing">
        <h2 id="landing-instruction" class="retro-text">KLIK HURUF UNTUK MENYUSUN 'PERMISI'</h2>
        <div id="scatter-area"></div>
        <div id="word-dock"></div>
    </div>

    <div id="main-site">
        <header>
            <h1 class="retro-text">Opang Darmawan</h1>
            <p>Ada Yang Bisa Dibantu?</p>
        </header>

        <nav class="nav-cats" id="category-nav"></nav>
        
        <button id="back-btn">⬅ KEMBALI KE KATEGORI</button>
        
        <div class="grid-3" id="content-area"></div>
    </div>

    <div id="social-container">
        <button class="social-btn" id="social-toggle">Hubungi<br>Saya!</button>
        <div class="social-menu" id="social-menu">
            <a href="https://wa.me/6281234567890" target="_blank" class="social-item">WhatsApp</a>
            <a href="https://instagram.com/opangdarmawan" target="_blank" class="social-item">Instagram</a>
        </div>
    </div>

    <div id="media-modal">
        <button id="close-modal">X CLOSE</button>
        <div class="media-content-container" id="media-content"></div>
    </div>

    <script>
        /* ----------------------------------------------------
           1. LOGIKA LANDING PAGE 'PERMISI' & AUDIO GITAR
        ---------------------------------------------------- */
        const targetWord = "PERMISI";
        let currentIndex = 0;
        
        const freqs = [329.63, 392.00, 440.00, 493.88, 523.25, 587.33, 659.25]; 
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function playGuitarNote(freq) {
            if (!audioCtx) audioCtx = new AudioContext();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 1.5);
        }

        const scatterArea = document.getElementById('scatter-area');
        const dockArea = document.getElementById('word-dock');

        let letters = targetWord.split('').map((char, i) => ({ char, id: i }));
        letters.sort(() => Math.random() - 0.5);

        letters.forEach(item => {
            let el = document.createElement('div');
            el.className = 'scatter-letter';
            el.innerText = item.char;
            el.style.top = (Math.random() * 60 + 10) + '%';
            el.style.left = (Math.random() * 70 + 10) + '%';

            el.onclick = () => {
                if (item.char === targetWord[currentIndex] && el.parentElement === scatterArea) {
                    playGuitarNote(freqs[currentIndex]);
                    el.classList.add('glow');
                    el.style.position = 'relative';
                    el.style.top = '0'; el.style.left = '0';
                    dockArea.appendChild(el);
                    currentIndex++;

                    if (currentIndex === targetWord.length) {
                        setTimeout(() => {
                            document.getElementById('landing').style.opacity = '0';
                            setTimeout(() => {
                                document.getElementById('landing').style.display = 'none';
                                document.getElementById('main-site').style.display = 'block';
                            }, 500);
                        }, 800);
                    }
                } else if (el.parentElement === scatterArea) {
                    el.classList.add('shake');
                    setTimeout(() => el.classList.remove('shake'), 300);
                }
            };
            scatterArea.appendChild(el);
        });

        /* ----------------------------------------------------
           2. DATA KONTEN
        ---------------------------------------------------- */
        const portfolioData = {
            "Fotografi": [
                {
                    title: "Fotografi AI", 
                    cover: "OKV06886b.jpg",
                    items: [
                        { title: "Memancing Kemungkinan", type: "img", src: "OKV06886b.jpg", cover: "OKV06886b.jpg" },
                        { title: "Menyelami Kemungkinan", type: "img", src: "Image_brzrz9brzrz9brzrd.jpg", cover: "Image_brzrz9brzrz9brzrd.jpg" },
                        { title: "Batas Kemungkinan", type: "img", src: "Image_2aiu2b2aiu2b2aiub.jpg", cover: "Image_2aiu2b2aiu2b2aiub.jpg" }
                    ]
                },
                {
                    title: "Fotografi Kamera", 
                    cover: "Cikaramat 1.jpeg",
                    items: [
                        { title: "Lembah Hijau", type: "img", src: "Cikaramat 1.jpeg", cover: "Cikaramat 1.jpeg" },
                        { title: "Hinggap malam Tiba", type: "img", src: "Cikaramat 2.jpeg", cover: "Cikaramat 2.jpeg" },
                        { title: "Hijau Yang Tinggi", type: "img", src: "Cikaramat 3.jpeg", cover: "Cikaramat 3.jpeg" }
                    ]
                },
                {
                    title: "Wildlife", 
                    cover: "dino 1.jpg",
                    items: [
                        { title: "Hutan Purba 1", type: "img", src: "dino 1.jpg", cover: "dino 1.jpg" },
                        { title: "Hutan Purba 2", type: "img", src: "dino 2.jpg", cover: "dino 2.jpg" },
                        { title: "Hutan Purba 3", type: "img", src: "dino 3.jpg", cover: "dino 3.jpg" } /* Typo diperbaiki disini */
                    ]
                }
            ],
            "Video": [
                {
                    title: "Video", 
                    cover: "Grading Video KAI.png",
                    items: [
                        /* --- INI BAGIAN YANG DIPERBARUI UNTUK INSTAGRAM --- */
                        { 
                            title: "Klip 1 (Instagram)", 
                            type: "ig-video", 
                            src: "https://www.instagram.com/reel/DWJcNzGiRvN/embed/", 
                            cover: "Grading Video KAI.png" 
                        },
                        { 
                            title: "Klip 1 (Instagram)", 
                            type: "ig-video", 
                            src: "https://www.instagram.com/reel/DSsWl99E2GZ/embed/", 
                            cover: "Video arthandling.png" 
                        },
                        { 
                            title: "Klip 1 (Instagram)", 
                            type: "ig-video", 
                            src: "https://www.instagram.com/reel/DWJcNzGiRvN/embed/", 
                            cover: "Grading Video KAI.png" 
                        },
                    ]
                },
                { title: "Vlog / Dokumenter", cover: "https://picsum.photos/400/300?random=13", items: [{title:"Segera Hadir", type:"img", src:"https://picsum.photos/1200/800", cover:"https://picsum.photos/400/300"}] },
                { title: "Shorts", cover: "https://picsum.photos/400/300?random=14", items: [{title:"Segera Hadir", type:"img", src:"https://picsum.photos/1200/800", cover:"https://picsum.photos/400/300"}] }
            ],
            "Desain": [
                {
                    title: "Brosur / PDF", 
                    cover: "https://picsum.photos/400/300?random=15",
                    items: [
                        { title: "Katalog 1 (PDF)", type: "pdf", src: "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf", cover: "https://picsum.photos/400/300?random=15" },
                        { title: "Poster 1", type: "img", src: "https://picsum.photos/1200/800?random=16", cover: "https://picsum.photos/400/300?random=16" },
                        { title: "Poster 2", type: "img", src: "https://picsum.photos/1200/800?random=17", cover: "https://picsum.photos/400/300?random=17" }
                    ]
                },
                { title: "Logo", cover: "https://picsum.photos/400/300?random=18", items: [{title:"Segera Hadir", type:"img", src:"https://picsum.photos/1200/800", cover:"https://picsum.photos/400/300"}] },
                { title: "UI/UX", cover: "https://picsum.photos/400/300?random=19", items: [{title:"Segera Hadir", type:"img", src:"https://picsum.photos/1200/800", cover:"https://picsum.photos/400/300"}] }
            ],
            "3Ddesain": [
                 {
                    title: "Karakter", 
                    cover: "https://picsum.photos/400/300?random=20",
                    items: [
                        { title: "Model 1", type: "img", src: "https://picsum.photos/1200/800?random=20", cover: "https://picsum.photos/400/300?random=20" },
                        { title: "Model 2", type: "img", src: "https://picsum.photos/1200/800?random=21", cover: "https://picsum.photos/400/300?random=21" },
                        { title: "Model 3", type: "img", src: "https://picsum.photos/1200/800?random=22", cover: "https://picsum.photos/400/300?random=22" }
                    ]
                },
                { title: "Arsitektur", cover: "https://picsum.photos/400/300?random=23", items: [{title:"Segera Hadir", type:"img", src:"https://picsum.photos/1200/800", cover:"https://picsum.photos/400/300"}] },
                { title: "Animasi 3D", cover: "https://picsum.photos/400/300?random=24", items: [{title:"Segera Hadir", type:"img", src:"https://picsum.photos/1200/800", cover:"https://picsum.photos/400/300"}] }
            ]
        };

        /* ----------------------------------------------------
           3. LOGIKA NAVIGASI & KOLAM BERJENJANG
        ---------------------------------------------------- */
        const navContainer = document.getElementById('category-nav');
        const contentArea = document.getElementById('content-area');
        const backBtn = document.getElementById('back-btn');
        let currentActiveCategory = "";

        Object.keys(portfolioData).forEach((cat, index) => {
            let btn = document.createElement('button');
            btn.className = 'nav-btn retro-text';
            btn.innerText = cat;
            if(index === 0) { btn.classList.add('active'); currentActiveCategory = cat; }
            btn.onclick = () => {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentActiveCategory = cat;
                renderSubCategories(cat);
            };
            navContainer.appendChild(btn);
        });

        function renderSubCategories(categoryName) {
            contentArea.innerHTML = '';
            backBtn.style.display = 'none';
            const subCats = portfolioData[categoryName];
            
            subCats.forEach((sub, index) => {
                let card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<img src="${sub.cover}" alt="Cover"><h3>${sub.title}</h3>`;
                card.onclick = () => renderItems(categoryName, index);
                contentArea.appendChild(card);
            });
        }

        function renderItems(categoryName, subIndex) {
            contentArea.innerHTML = '';
            backBtn.style.display = 'inline-block';
            const items = portfolioData[categoryName][subIndex].items;

            items.forEach(item => {
                let card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<img src="${item.cover}" alt="Item Cover"><h3>${item.title}</h3>`;
                card.onclick = () => openMediaModal(item.type, item.src);
                contentArea.appendChild(card);
            });
        }

        backBtn.onclick = () => renderSubCategories(currentActiveCategory);
        renderSubCategories(currentActiveCategory);

        /* ----------------------------------------------------
           4. LOGIKA MEDIA VIEWER (GAMBAR / VIDEO / PDF / IG)
        ---------------------------------------------------- */
        const modal = document.getElementById('media-modal');
        const mediaContent = document.getElementById('media-content');
        const closeModalBtn = document.getElementById('close-modal');

        function openMediaModal(type, src) {
            modal.style.display = 'flex';
            mediaContent.innerHTML = ''; 
            
            if (type === 'img') {
                mediaContent.innerHTML = `<img src="${src}" alt="Full Media">`;
            } else if (type === 'video') {
                mediaContent.innerHTML = `<video src="${src}" controls autoplay></video>`;
            } else if (type === 'ig-video') {
                // Render iframe untuk Instagram
                mediaContent.innerHTML = `<iframe src="${src}" frameborder="0" scrolling="no" allowtransparency="true"></iframe>`;
            } else if (type === 'pdf') {
                mediaContent.innerHTML = `<iframe src="${src}"></iframe>`;
            }
        }

        closeModalBtn.onclick = () => {
            modal.style.display = 'none';
            mediaContent.innerHTML = ''; // Menghentikan video / iframe dengan mengosongkan konten
        };

        /* ----------------------------------------------------
           5. LOGIKA TOGGLE SOCIAL MEDIA & WHATSAPP
        ---------------------------------------------------- */
        const socialToggle = document.getElementById('social-toggle');
        const socialMenu = document.getElementById('social-menu');
        
        socialToggle.onclick = () => {
            if (socialMenu.style.display === 'flex') {
                socialMenu.style.display = 'none';
            } else {
                socialMenu.style.display = 'flex';
            }
        };
    </script>
</body>
</html>
