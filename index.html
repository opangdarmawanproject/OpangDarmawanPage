<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Pop Portfolio</title>
    <style>
        /* === FONT & ROOT STYLES === */
        @import url('https://fonts.googleapis.com/css2?family=Righteous&family=Space+Grotesk:wght@400;700&display=swap');
        
        :root {
            --hot-pink: #ff007b;
            --cyan: #00f0ff;
            --yellow: #ffd900;
            --lime: #00ff73;
            --dark: #1a1a1a;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--yellow);
            color: var(--dark);
            overflow-x: hidden;
        }

        h1, h2, h3, .retro-font { font-family: 'Righteous', cursive; }

        /* Gaya Kotak Retro (Brutalism/Pop Art) */
        .retro-box {
            border: 4px solid var(--dark);
            box-shadow: 8px 8px 0px var(--dark);
            background: white;
            border-radius: 0;
        }

        /* === HALAMAN INTRO (TEKA-TEKI PERMISI) === */
        #intro-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--hot-pink);
            background-image: radial-gradient(var(--dark) 2px, transparent 2px);
            background-size: 30px 30px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 10vh;
            transition: opacity 1s ease-out;
        }

        .scattered-letter {
            position: absolute;
            font-size: 5rem;
            font-family: 'Righteous', cursive;
            color: var(--cyan);
            -webkit-text-stroke: 2px var(--dark);
            text-shadow: 4px 4px 0px var(--dark);
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
        }

        .scattered-letter:hover, .scattered-letter.glow {
            color: white;
            text-shadow: 0 0 15px white, 0 0 30px var(--cyan), 4px 4px 0px var(--dark);
            transform: scale(1.2) rotate(10deg);
        }

        #slots-container {
            display: flex;
            gap: 10px;
            background: rgba(0,0,0,0.5);
            padding: 20px;
            border-radius: 10px;
            border: 4px dashed var(--yellow);
        }

        .slot {
            width: 60px; height: 80px;
            background: rgba(255,255,255,0.2);
            border: 2px solid white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            font-family: 'Righteous', cursive;
            color: var(--yellow);
            text-shadow: 2px 2px 0px var(--dark);
        }

        /* === HALAMAN UTAMA === */
        #main-screen { display: none; padding: 20px; }
        
        header {
            text-align: center;
            padding: 40px 20px;
            background: var(--cyan);
            margin-bottom: 20px;
        }

        header h1 { font-size: 4rem; margin: 0; text-transform: uppercase; letter-spacing: 5px; color: white; -webkit-text-stroke: 2px var(--dark); text-shadow: 6px 6px 0px var(--dark);}

        /* Navigasi Kategori */
        nav { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-bottom: 30px; }
        .nav-btn {
            padding: 10px 20px;
            font-size: 1.2rem;
            font-family: 'Righteous', cursive;
            background: var(--hot-pink);
            color: white;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .nav-btn:active { transform: translate(4px, 4px); box-shadow: 4px 4px 0px var(--dark); }
        .nav-btn.active { background: var(--lime); color: var(--dark); }

        /* Form Upload */
        #upload-section {
            background: #fff;
            padding: 20px;
            margin: 0 auto 30px auto;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }
        #upload-section input, #upload-section select, #upload-section button {
            padding: 10px; font-size: 1rem; border: 2px solid var(--dark); font-family: 'Space Grotesk', sans-serif;
        }
        #upload-btn { background: var(--cyan); font-weight: bold; cursor: pointer; }
        #upload-btn:hover { background: var(--yellow); }

        /* Grid Media (3 Kolom) */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .media-item {
            aspect-ratio: 1;
            background: #eee;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        .media-item img, .media-item video {
            width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s;
        }
        .media-item:hover img, .media-item:hover video { transform: scale(1.1); }
        .media-item .pdf-label {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background: var(--hot-pink); color: white; font-size: 2rem; font-family: 'Righteous';
        }

        /* === MEDIA VIEWER (LIGHTBOX) === */
        #media-viewer {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.9); z-index: 9999; justify-content: center; align-items: center;
        }
        #viewer-content { width: 90%; height: 90%; display: flex; justify-content: center; align-items: center; }
        #viewer-content img, #viewer-content video, #viewer-content iframe {
            max-width: 100%; max-height: 100%; border: 4px solid white; box-shadow: 0 0 20px rgba(255,255,255,0.5);
        }
        #close-viewer {
            position: absolute; top: 20px; right: 30px; font-size: 3rem; color: var(--hot-pink);
            cursor: pointer; font-family: sans-serif; font-weight: bold; text-shadow: 2px 2px 0 white;
        }

        /* === SOSIAL MEDIA FLOATING === */
        #social-toggle {
            position: fixed; bottom: 30px; right: 30px;
            width: 60px; height: 60px; border-radius: 50%;
            background: var(--lime); display: flex; justify-content: center; align-items: center;
            font-size: 2rem; cursor: pointer; z-index: 9000; border: 3px solid var(--dark);
        }
        #social-menu {
            display: none; position: fixed; bottom: 100px; right: 30px;
            flex-direction: column; gap: 10px; z-index: 9000;
        }
        .social-btn {
            padding: 10px 20px; background: white; text-decoration: none; color: var(--dark);
            font-weight: bold; font-family: 'Righteous'; text-align: center;
        }
        .wa-btn { background: #25D366; color: white;}

        /* Responsive */
        @media (max-width: 768px) {
            .media-grid { grid-template-columns: repeat(1, 1fr); }
            header h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div id="intro-screen">
        <h2 style="color: white; margin-bottom: 20px; text-shadow: 2px 2px #000;">Susun Kata Ini</h2>
        <div id="slots-container">
            <div class="slot"></div><div class="slot"></div><div class="slot"></div>
            <div class="slot"></div><div class="slot"></div><div class="slot"></div>
            <div class="slot"></div>
        </div>
    </div>

    <div id="main-screen">
        <header class="retro-box">
            <h1>Retro Portofolio</h1>
            <p style="font-weight: bold;">Estetika Pop Art & Kreativitas Tanpa Batas</p>
        </header>

        <nav>
            <div class="nav-btn retro-box active" onclick="changeCategory('Fotografi')">Fotografi</div>
            <div class="nav-btn retro-box" onclick="changeCategory('Video')">Video</div>
            <div class="nav-btn retro-box" onclick="changeCategory('Desain')">Desain</div>
            <div class="nav-btn retro-box" onclick="changeCategory('3D Desain')">3D Desain</div>
        </nav>

        <div id="upload-section" class="retro-box">
            <h3>Unggah Karyamu</h3>
            <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;">
                <input type="file" id="file-input" accept="image/*,video/*,application/pdf">
                <select id="category-select">
                    <option value="Fotografi">Fotografi</option>
                    <option value="Video">Video</option>
                    <option value="Desain">Desain</option>
                    <option value="3D Desain">3D Desain</option>
                </select>
                <button id="upload-btn" class="retro-box" onclick="handleUpload()">Tambahkan Media</button>
            </div>
        </div>

        <main>
            <div id="media-grid" class="media-grid">
                </div>
        </main>

        <div id="social-toggle" onclick="toggleSocial()">📱</div>
        <div id="social-menu">
            <a href="#" class="social-btn retro-box wa-btn">WhatsApp</a>
            <a href="#" class="social-btn retro-box">Instagram</a>
            <a href="#" class="social-btn retro-box">Facebook</a>
        </div>
    </div>

    <div id="media-viewer">
        <div id="close-viewer" onclick="closeViewer()">X</div>
        <div id="viewer-content"></div>
    </div>

    <script>
        // === 1. AUDIO SYNTHESIZER (Suara Gitar Retro tanpa file eksternal) ===
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function playGuitarPluck() {
            if (!audioCtx) audioCtx = new AudioContext();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = 'triangle'; // Meniru resonansi senar
            osc.frequency.setValueAtTime(Math.random() * 200 + 300, audioCtx.currentTime); // Nada acak
            
            gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        // === 2. LOGIKA INTRO (TEKA-TEKI PERMISI) ===
        const targetWord = "PERMISI";
        let currentGuess = [];
        const introScreen = document.getElementById('intro-screen');
        const slots = document.querySelectorAll('.slot');

        function createScatteredLetters() {
            const letters = targetWord.split('').sort(() => Math.random() - 0.5);
            
            letters.forEach((char, index) => {
                const el = document.createElement('div');
                el.innerText = char;
                el.className = 'scattered-letter';
                
                // Posisi acak (menghindari tepi layar dan area slot bawah)
                const top = Math.random() * 60 + 10; 
                const left = Math.random() * 80 + 10;
                el.style.top = `${top}vh`;
                el.style.left = `${left}vw`;

                el.onclick = () => {
                    if (currentGuess.length < 7) {
                        playGuitarPluck();
                        el.classList.add('glow');
                        
                        setTimeout(() => {
                            el.style.display = 'none'; // Sembunyikan huruf yang berhamburan
                            slots[currentGuess.length].innerText = char; // Masukkan ke slot
                            currentGuess.push(char);

                            // Cek jika sudah 7 huruf
                            if (currentGuess.length === 7) {
                                if (currentGuess.join('') === targetWord) {
                                    unlockWebsite();
                                } else {
                                    alert('Kata salah! Silakan coba lagi.');
                                    resetPuzzle();
                                }
                            }
                        }, 200);
                    }
                };
                introScreen.appendChild(el);
            });
        }

        function resetPuzzle() {
            currentGuess = [];
            slots.forEach(slot => slot.innerText = '');
            document.querySelectorAll('.scattered-letter').forEach(el => el.remove());
            createScatteredLetters();
        }

        function unlockWebsite() {
            introScreen.style.opacity = '0';
            setTimeout(() => {
                introScreen.style.display = 'none';
                document.getElementById('main-screen').style.display = 'block';
                renderCategory('Fotografi'); // Muat kategori default
            }, 1000);
        }

        // Mulai teka-teki
        createScatteredLetters();

        // === 3. LOGIKA KONTEN & UNGGAH (GALLERY) ===
        const mediaDatabase = {
            'Fotografi': [],
            'Video': [],
            'Desain': [],
            '3D Desain': []
        };
        let currentCategory = 'Fotografi';

        function changeCategory(category) {
            currentCategory = category;
            
            // Ubah tampilan tombol aktif
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText === category) btn.classList.add('active');
            });

            // Sinkronisasi dropdown upload dengan tab yang sedang aktif
            document.getElementById('category-select').value = category;
            
            renderCategory(category);
        }

        function renderCategory(category) {
            const grid = document.getElementById('media-grid');
            grid.innerHTML = ''; // Bersihkan grid

            const items = mediaDatabase[category];
            if (items.length === 0) {
                grid.innerHTML = `<p style="grid-column: span 3; text-align: center; font-weight:bold;">Belum ada media di kategori ${category}. Silakan unggah!</p>`;
                return;
            }

            items.forEach(media => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'media-item retro-box';
                itemDiv.onclick = () => openViewer(media.url, media.type);

                if (media.type.startsWith('image/')) {
                    itemDiv.innerHTML = `<img src="${media.url}" alt="Image">`;
                } else if (media.type.startsWith('video/')) {
                    itemDiv.innerHTML = `<video src="${media.url}" muted></video>`;
                } else if (media.type === 'application/pdf') {
                    itemDiv.innerHTML = `<div class="pdf-label">📄 PDF</div>`;
                }

                grid.appendChild(itemDiv);
            });
        }

        function handleUpload() {
            const fileInput = document.getElementById('file-input');
            const categorySelect = document.getElementById('category-select').value;
            const file = fileInput.files[0];

            if (file) {
                // Membuat URL lokal sementara (sangat aman, tidak pakai internet)
                const fileURL = URL.createObjectURL(file);
                
                mediaDatabase[categorySelect].push({
                    url: fileURL,
                    type: file.type
                });

                alert('Berhasil ditambahkan ke ' + categorySelect);
                fileInput.value = ''; // Reset input
                
                // Jika sedang di kategori tersebut, render ulang
                if (currentCategory === categorySelect) {
                    renderCategory(currentCategory);
                }
            } else {
                alert('Pilih file terlebih dahulu!');
            }
        }

        // === 4. LOGIKA MEDIA VIEWER (LIGHTBOX FULL SIZE) ===
        const viewer = document.getElementById('media-viewer');
        const viewerContent = document.getElementById('viewer-content');

        function openViewer(url, type) {
            viewer.style.display = 'flex';
            viewerContent.innerHTML = ''; // Bersihkan layar

            if (type.startsWith('image/')) {
                viewerContent.innerHTML = `<img src="${url}" alt="Fullscreen">`;
            } else if (type.startsWith('video/')) {
                viewerContent.innerHTML = `<video src="${url}" controls autoplay></video>`;
            } else if (type === 'application/pdf') {
                viewerContent.innerHTML = `<iframe src="${url}" width="100%" height="100%"></iframe>`;
            }
        }

        function closeViewer() {
            viewer.style.display = 'none';
            viewerContent.innerHTML = ''; // Hapus iframe/video agar suara berhenti
        }

        // === 5. TOGGLE SOSIAL MEDIA ===
        function toggleSocial() {
            const menu = document.getElementById('social-menu');
            menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
        }
    </script>
</body>
</html>
