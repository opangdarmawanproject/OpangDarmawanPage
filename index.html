<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opang Darmawan - Retro Pop Portfolio</title>
    <style>
        /* ================= CSS RETRO POP ================= */
        @import url('https://fonts.googleapis.com/css2?family=Righteous&family=Space+Mono:wght@400;700&display=swap');

        :root {
            --bg-color: #2b00ff;
            --text-color: #111;
            --yellow: #fffb00;
            --pink: #ff007f;
            --cyan: #00ffff;
            --box-shadow: 6px 6px 0px #000;
            --border: 4px solid #000;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Space Mono', monospace;
            background-color: var(--bg-color);
            background-image: radial-gradient(var(--cyan) 15%, transparent 16%), radial-gradient(var(--pink) 15%, transparent 16%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            color: var(--text-color);
            overflow-x: hidden;
        }

        /* --- Intro Screen (PERMISI) --- */
        #intro-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--bg-color);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 10vh;
        }
        
        .scattered-letter {
            position: absolute;
            font-family: 'Righteous', cursive;
            font-size: 4rem;
            color: var(--yellow);
            text-shadow: 4px 4px 0px var(--pink), -2px -2px 0px var(--cyan);
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s, text-shadow 0.2s;
        }

        .scattered-letter:hover, .scattered-letter.glowing {
            transform: scale(1.2);
            text-shadow: 0 0 20px var(--yellow), 4px 4px 0px var(--pink);
        }

        #assembly-box {
            display: flex;
            gap: 10px;
            min-width: 300px;
            height: 80px;
            border: var(--border);
            background: #fff;
            box-shadow: var(--box-shadow);
            padding: 10px;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        /* --- Main Website --- */
        #main-content {
            display: none;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.9);
            min-height: 100vh;
            border-left: var(--border);
            border-right: var(--border);
        }

        header {
            text-align: center;
            padding: 20px 0;
            border-bottom: var(--border);
            margin-bottom: 30px;
            background: var(--yellow);
            box-shadow: var(--box-shadow);
        }

        header h1 {
            font-family: 'Righteous', cursive;
            font-size: 3.5rem;
            margin: 0;
            color: var(--pink);
            text-shadow: 3px 3px 0px #000;
        }

        .nav-menu {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .retro-btn {
            background: var(--cyan);
            border: var(--border);
            padding: 10px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
            transition: all 0.1s;
            font-family: inherit;
        }

        .retro-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #000;
        }

        .retro-btn.pink { background: var(--pink); color: white; }

        /* --- 3 Kolam Grid --- */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .card {
            background: #fff;
            border: var(--border);
            box-shadow: var(--box-shadow);
            padding: 15px;
            text-align: center;
            transition: transform 0.2s;
        }

        .card:hover { transform: translateY(-5px); }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border: 2px solid #000;
            margin-bottom: 10px;
        }

        .card h3 {
            font-family: 'Righteous', cursive;
            font-size: 1.5rem;
            margin: 10px 0;
            color: var(--bg-color);
        }

        .upload-btn {
            background: #eee;
            border: 2px solid #000;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 0.8rem;
            margin-bottom: 10px;
            display: inline-block;
        }

        /* --- Modals (Popup) --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.8);
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--yellow);
            border: var(--border);
            box-shadow: 10px 10px 0px #000;
            padding: 30px;
            text-align: center;
            max-width: 90vw;
            max-height: 90vh;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: -15px; right: -15px;
            background: var(--pink);
            color: white;
            border: var(--border);
            width: 40px; height: 40px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #media-container {
            width: 80vw;
            height: 70vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #media-container img, #media-container video, #media-container iframe {
            max-width: 100%;
            max-height: 100%;
            width: 100%;
            height: 100%;
        }
        
        .social-links a {
            display: block;
            margin: 15px 0;
            font-size: 1.5rem;
            color: var(--bg-color);
            text-decoration: none;
            font-family: 'Righteous', cursive;
        }
        .social-links a:hover { color: var(--pink); }

        #breadcrumb { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="intro-screen">
        <h2 style="position:absolute; top:20px; color:white; background:black; padding:5px 10px; border:2px solid white;">Klik Huruf untuk Menyusun "PERMISI"</h2>
        <div id="assembly-box"></div>
    </div>

    <div id="main-content">
        <header>
            <h1>OPANG DARMAWAN</h1>
            <div class="nav-menu">
                <button class="retro-btn" onclick="renderLevel1('Fotografi')">FOTOGRAFI</button>
                <button class="retro-btn" onclick="renderLevel1('Video')">VIDEO</button>
                <button class="retro-btn" onclick="renderLevel1('Desain')">DESAIN</button>
                <button class="retro-btn" onclick="renderLevel1('3Ddesain')">3D DESAIN</button>
                <button class="retro-btn pink" onclick="document.getElementById('social-modal').style.display='flex'">KONTAK</button>
            </div>
        </header>

        <div id="breadcrumb">Silakan pilih menu di atas!</div>
        <div id="content-area" class="grid-container">
            </div>
    </div>

    <div id="media-modal" class="modal">
        <div class="modal-content" style="background:#fff;">
            <button class="close-btn" onclick="closeMedia()">X</button>
            <div id="media-container"></div>
        </div>
    </div>

    <div id="social-modal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="document.getElementById('social-modal').style.display='none'">X</button>
            <h2 style="font-family:'Righteous', cursive; font-size: 2rem;">HUBUNGI OPANG</h2>
            <div class="social-links">
                <a href="https://wa.me/6280000000000" target="_blank">📞 WhatsApp Me</a>
                <a href="https://instagram.com/" target="_blank">📸 Instagram</a>
                <a href="https://behance.net/" target="_blank">🎨 Behance Portofolio</a>
            </div>
        </div>
    </div>

    <script>
        // --- 1. AUDIO (GUITAR SYNTH) ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playGuitarSound(index) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            // Frequencies for P-E-R-M-I-S-I (Simple major scale)
            const freqs = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 523.25];
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = 'triangle'; // Terdengar seperti petikan senar vintage
            osc.frequency.setValueAtTime(freqs[index % freqs.length], audioCtx.currentTime);
            
            gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 1.5);
        }

        // --- 2. INTRO LOGIC (PERMISI) ---
        const targetWord = "PERMISI";
        let currentWord = "";
        let attemptCount = 0;
        const introScreen = document.getElementById('intro-screen');
        const assemblyBox = document.getElementById('assembly-box');

        function initIntro() {
            assemblyBox.innerHTML = '';
            currentWord = "";
            const letters = targetWord.split('');
            // Acak posisi
            const shuffledLetters = letters.map((char, i) => ({ char, id: i })).sort(() => Math.random() - 0.5);

            document.querySelectorAll('.scattered-letter').forEach(el => el.remove());

            shuffledLetters.forEach((item, index) => {
                let el = document.createElement('div');
                el.className = 'scattered-letter';
                el.innerText = item.char;
                // Posisi acak di layar
                el.style.left = (Math.random() * 70 + 10) + 'vw';
                el.style.top = (Math.random() * 60 + 10) + 'vh';
                
                el.onclick = () => {
                    playGuitarSound(currentWord.length);
                    el.classList.add('glowing');
                    el.style.position = 'static'; // Masuk ke box
                    assemblyBox.appendChild(el);
                    currentWord += item.char;
                    el.onclick = null; // Matikan klik setelah masuk box

                    if (currentWord.length === targetWord.length) {
                        if (currentWord === targetWord) {
                            setTimeout(() => {
                                document.getElementById('intro-screen').style.display = 'none';
                                document.getElementById('main-content').style.display = 'block';
                            }, 500);
                        } else {
                            setTimeout(() => {
                                alert("Susunan salah! Coba susun 'PERMISI'.");
                                initIntro();
                            }, 300);
                        }
                    }
                };
                introScreen.appendChild(el);
            });
        }
        initIntro();

        // --- 3. DATA WEBSITE (3 Kolam -> 3 Kolam) ---
        // Anda bisa mengganti URL gambar default dengan placeholder atau gambar asli Anda
        const placeholderImg = "https://picsum.photos/600/400?random=";
        const dummyPdf = "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf";
        const dummyVideo = "https://www.w3schools.com/html/mov_bbb.mp4";

        const siteData = {
            "Fotografi": [
                { name: "Fotografi AI", cover: placeholderImg+"1", items: [
                    { name: "Karya AI 1", file: placeholderImg+"11", type: "img" },
                    { name: "Karya AI 2", file: placeholderImg+"12", type: "img" },
                    { name: "Karya AI 3", file: placeholderImg+"13", type: "img" }
                ]},
                { name: "Fotografi Kamera", cover: placeholderImg+"2", items: [
                    { name: "Jepretan 1", file: placeholderImg+"14", type: "img" },
                    { name: "Jepretan 2", file: placeholderImg+"15", type: "img" },
                    { name: "Jepretan 3", file: placeholderImg+"16", type: "img" }
                ]},
                { name: "Komersial", cover: placeholderImg+"3", items: [
                    { name: "Produk 1", file: placeholderImg+"17", type: "img" },
                    { name: "Produk 2", file: placeholderImg+"18", type: "img" },
                    { name: "Produk 3", file: placeholderImg+"19", type: "img" }
                ]}
            ],
            "Video": [
                { name: "Video Musik", cover: placeholderImg+"4", items: [
                    { name: "Klip 1", file: dummyVideo, type: "video" },
                    { name: "Klip 2", file: dummyVideo, type: "video" },
                    { name: "Klip 3", file: dummyVideo, type: "video" }
                ]},
                { name: "Iklan", cover: placeholderImg+"5", items: [
                    { name: "Iklan 1", file: dummyVideo, type: "video" },
                    { name: "Iklan 2", file: dummyVideo, type: "video" },
                    { name: "Iklan 3", file: dummyVideo, type: "video" }
                ]},
                { name: "Dokumenter", cover: placeholderImg+"6", items: [
                    { name: "Doc 1", file: dummyVideo, type: "video" },
                    { name: "Doc 2", file: dummyVideo, type: "video" },
                    { name: "Doc 3", file: dummyVideo, type: "video" }
                ]}
            ],
            "Desain": [
                { name: "Logo & Branding", cover: placeholderImg+"7", items: [
                    { name: "Brand 1", file: placeholderImg+"20", type: "img" },
                    { name: "Brand 2", file: placeholderImg+"21", type: "img" },
                    { name: "Brand 3", file: placeholderImg+"22", type: "img" }
                ]},
                { name: "Ilustrasi", cover: placeholderImg+"8", items: [
                    { name: "Vector 1", file: placeholderImg+"23", type: "img" },
                    { name: "Vector 2", file: placeholderImg+"24", type: "img" },
                    { name: "Vector 3", file: placeholderImg+"25", type: "img" }
                ]},
                { name: "Dokumen PDF", cover: placeholderImg+"9", items: [
                    { name: "Majalah", file: dummyPdf, type: "pdf" },
                    { name: "Brosur", file: dummyPdf, type: "pdf" },
                    { name: "Katalog", file: dummyPdf, type: "pdf" }
                ]}
            ],
            "3Ddesain": [
                { name: "Karakter 3D", cover: placeholderImg+"10", items: [
                    { name: "Hero", file: placeholderImg+"26", type: "img" },
                    { name: "Monster", file: placeholderImg+"27", type: "img" },
                    { name: "NPC", file: placeholderImg+"28", type: "img" }
                ]},
                { name: "Lingkungan", cover: placeholderImg+"29", items: [
                    { name: "Kota", file: placeholderImg+"30", type: "img" },
                    { name: "Hutan", file: placeholderImg+"31", type: "img" },
                    { name: "Ruang Angkasa", file: placeholderImg+"32", type: "img" }
                ]},
                { name: "Animasi 3D", cover: placeholderImg+"33", items: [
                    { name: "Reel 1", file: dummyVideo, type: "video" },
                    { name: "Reel 2", file: dummyVideo, type: "video" },
                    { name: "Reel 3", file: dummyVideo, type: "video" }
                ]}
            ]
        };

        const contentArea = document.getElementById('content-area');
        const breadcrumb = document.getElementById('breadcrumb');

        // --- 4. LOGIC RENDER KONTEN & UPLOAD COVER ---
        
        // Fungsi untuk mengunggah gambar cover sementara ke memori browser
        function handleCoverUpload(event, imgId) {
            const file = event.target.files[0];
            if(file) {
                const imgURL = URL.createObjectURL(file);
                document.getElementById(imgId).src = imgURL;
            }
        }

        // Level 1: Render 3 Sub-kategori
        function renderLevel1(categoryName) {
            breadcrumb.innerHTML = `Kategori: <b>${categoryName}</b>`;
            contentArea.innerHTML = '';
            const subCategories = siteData[categoryName];

            subCategories.forEach((sub, index) => {
                const uniqueId = `cover-${categoryName}-${index}`;
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${sub.cover}" id="${uniqueId}" alt="Cover">
                    <label class="upload-btn">
                        Ubah Cover Custom
                        <input type="file" accept="image/*" style="display:none;" onchange="handleCoverUpload(event, '${uniqueId}')">
                    </label>
                    <h3>${sub.name}</h3>
                    <button class="retro-btn" onclick='renderLevel2(${JSON.stringify(sub.items)}, "${categoryName} > ${sub.name}")'>Lihat ${sub.name}</button>
                `;
                contentArea.appendChild(card);
            });
        }

        // Level 2: Render 3 Item dalam Sub-kategori
        function renderLevel2(items, pathText) {
            breadcrumb.innerHTML = `Kategori: <b>${pathText}</b>`;
            contentArea.innerHTML = '';

            items.forEach((item, index) => {
                const uniqueId = `item-${index}`;
                const card = document.createElement('div');
                card.className = 'card';
                
                // Jika item adalah PDF/Video, beri cover placeholder agar tidak berat
                let coverImg = item.type === 'img' ? item.file : placeholderImg + (Math.floor(Math.random() * 100));

                card.innerHTML = `
                    <img src="${coverImg}" id="${uniqueId}" alt="Item Cover">
                    <label class="upload-btn">
                        Ubah Cover Custom
                        <input type="file" accept="image/*" style="display:none;" onchange="handleCoverUpload(event, '${uniqueId}')">
                    </label>
                    <h3>${item.name}</h3>
                    <button class="retro-btn pink" onclick="openMedia('${item.file}', '${item.type}')">Buka Penampil Penuh</button>
                `;
                contentArea.appendChild(card);
            });
        }

        // --- 5. LOGIC MEDIA VIEWER ---
        const mediaModal = document.getElementById('media-modal');
        const mediaContainer = document.getElementById('media-container');

        function openMedia(url, type) {
            mediaModal.style.display = 'flex';
            mediaContainer.innerHTML = ''; // Bersihkan dulu

            if(type === 'img') {
                mediaContainer.innerHTML = `<img src="${url}" alt="Karya">`;
            } else if (type === 'video') {
                mediaContainer.innerHTML = `<video src="${url}" controls autoplay></video>`;
            } else if (type === 'pdf') {
                mediaContainer.innerHTML = `<iframe src="${url}" frameborder="0"></iframe>`;
            }
        }

        function closeMedia() {
            mediaModal.style.display = 'none';
            mediaContainer.innerHTML = ''; // Menghentikan video/audio saat ditutup
        }
    </script>
</body>
</html>
