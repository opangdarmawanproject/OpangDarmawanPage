<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Pop Portofolio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@400;700&display=swap');

        /* === VARIABEL WARNA RETRO POP === */
        :root {
            --bg-color: #FFE600; /* Kuning cerah */
            --pink: #FF007F;
            --cyan: #00F0FF;
            --black: #111;
            --white: #FFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--black);
            overflow-x: hidden;
        }

        h1, h2, h3, .retro-text {
            font-family: 'Bangers', cursive;
            letter-spacing: 2px;
        }

        /* === HALAMAN INTRO (PERMISI) === */
        #intro-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: var(--black);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .scattered-area {
            position: relative;
            width: 100%;
            height: 60vh;
        }

        .huruf-intro {
            position: absolute;
            font-family: 'Bangers', cursive;
            font-size: 4rem;
            color: var(--white);
            cursor: pointer;
            user-select: none;
            transition: all 0.3s;
            text-shadow: 0 0 10px var(--cyan), 0 0 20px var(--pink);
        }

        .huruf-intro:hover {
            transform: scale(1.3);
        }

        #susunan-target {
            height: 100px;
            display: flex;
            gap: 10px;
            border-bottom: 4px dashed var(--pink);
            padding: 10px;
            min-width: 300px;
            justify-content: center;
            align-items: flex-end;
        }

        .huruf-terkunci {
            font-family: 'Bangers', cursive;
            font-size: 4rem;
            color: var(--bg-color);
            text-shadow: 3px 3px 0px var(--pink);
        }

        /* === HALAMAN UTAMA === */
        #main-screen {
            display: none; /* Disembunyikan sampai puzzle selesai */
            padding: 20px;
            max-width: 1200px;
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            background: var(--pink);
            border: 4px solid var(--black);
            box-shadow: 8px 8px 0px var(--black);
            color: var(--white);
        }

        header h1 {
            font-size: 3rem;
            text-shadow: 3px 3px 0px var(--black);
        }

        /* Navigasi */
        nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .btn-retro {
            background-color: var(--cyan);
            border: 3px solid var(--black);
            padding: 10px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 5px 5px 0px var(--black);
            transition: all 0.1s;
        }

        .btn-retro:active {
            box-shadow: 0px 0px 0px var(--black);
            transform: translate(5px, 5px);
        }

        /* Grid Kategori (3 Kolom) */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--white);
            border: 4px solid var(--black);
            box-shadow: 6px 6px 0px var(--black);
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
            background: #f0f0f0;
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border: 2px solid var(--black);
            margin-bottom: 10px;
        }

        /* Tombol Navigasi Kembali */
        #btn-kembali {
            display: none;
            background-color: var(--pink);
            color: white;
            margin-bottom: 20px;
        }

        /* === MEDIA SOSIAL & WA === */
        #sosmed-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: var(--bg-color);
            border-radius: 50%;
            width: 60px; height: 60px;
            font-size: 24px;
            display: flex; align-items: center; justify-content: center;
            z-index: 100;
        }

        #sosmed-popup {
            display: none;
            position: fixed;
            bottom: 90px;
            right: 20px;
            background: var(--white);
            border: 3px solid var(--black);
            box-shadow: 5px 5px 0px var(--black);
            padding: 15px;
            z-index: 100;
            flex-direction: column;
            gap: 10px;
        }

        #sosmed-popup a {
            text-decoration: none;
            color: var(--black);
            font-weight: bold;
            padding: 5px;
            border-bottom: 2px solid transparent;
        }
        #sosmed-popup a:hover { border-bottom: 2px solid var(--pink); }

        /* === LIGHTBOX VIEWER === */
        #lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        #lightbox-content {
            max-width: 90%;
            max-height: 90%;
            border: 5px solid var(--cyan);
            box-shadow: 10px 10px 0px var(--pink);
            background: var(--white);
        }

        #lightbox img, #lightbox video, #lightbox iframe {
            width: 100%;
            height: 80vh;
            display: block;
        }

        .btn-close {
            position: absolute;
            top: 20px;
            right: 30px;
            background: var(--pink);
            color: white;
            font-size: 1.5rem;
            padding: 10px 20px;
            border: 3px solid var(--black);
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--black);
        }
    </style>
</head>
<body>

    <div id="intro-screen">
        <h2 style="color:var(--white); margin-bottom:10px;">SUSUN KATA UNTUK MASUK</h2>
        <div id="susunan-target"></div>
        <div class="scattered-area" id="scattered-area">
            </div>
    </div>

    <div id="main-screen">
        <header>
            <h1>RETRO POP STUDIO</h1>
            <p>Karya Nyata, Warna Merona!</p>
        </header>

        <nav>
            <button class="btn-retro" onclick="loadKategori('Fotografi')">Fotografi</button>
            <button class="btn-retro" onclick="loadKategori('Video')">Video</button>
            <button class="btn-retro" onclick="loadKategori('Desain')">Desain</button>
            <button class="btn-retro" onclick="loadKategori('3Ddesain')">3D Desain</button>
        </nav>

        <button class="btn-retro" id="btn-kembali" onclick="kembaliKeKategoriUtama()">⬅ Kembali</button>
        
        <h2 id="judul-seksi" style="margin-bottom:15px; font-size:2rem; border-bottom:4px solid var(--black); display:inline-block;">Pilih Kategori</h2>
        
        <div class="grid-container" id="konten-grid">
            </div>
    </div>

    <button id="sosmed-btn" class="btn-retro" onclick="toggleSosmed()">💬</button>
    <div id="sosmed-popup">
        <a href="https://wa.me/6280000000000" target="_blank">🟢 WhatsApp</a>
        <a href="#" target="_blank">🟣 Instagram</a>
        <a href="#" target="_blank">🔵 Facebook</a>
    </div>

    <div id="lightbox">
        <button class="btn-close" onclick="closeLightbox()">X CLOSE</button>
        <div id="lightbox-content">
            </div>
    </div>

    <script>
        /* === 1. AUDIO SYNTH (Suara Gitar Retro Tanpa File Eksternal) === */
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function playGuitarSound() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'triangle'; // Mirip petikan senar sintesis
            osc.frequency.setValueAtTime(220 + Math.random() * 200, audioCtx.currentTime); // Frekuensi acak tiap huruf
            
            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5); // Fade out cepat
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        /* === 2. LOGIKA INTRO "PERMISI" === */
        const kataKunci = "PERMISI".split('');
        let urutanSaatIni = 0;

        function inisialisasiIntro() {
            const area = document.getElementById('scattered-area');
            const target = document.getElementById('susunan-target');
            
            // Acak posisi huruf
            let hurufAcak = [...kataKunci].sort(() => Math.random() - 0.5);
            
            hurufAcak.forEach((huruf) => {
                let el = document.createElement('div');
                el.innerText = huruf;
                el.className = 'huruf-intro';
                
                // Posisi Acak
                el.style.left = Math.floor(Math.random() * 80) + 10 + '%';
                el.style.top = Math.floor(Math.random() * 80) + 10 + '%';
                
                el.onclick = () => {
                    playGuitarSound();
                    // Cek apakah huruf yang diklik sesuai urutan "PERMISI"
                    if (huruf === kataKunci[urutanSaatIni]) {
                        el.style.display = 'none'; // Sembunyikan yang berhamburan
                        
                        let kunciEl = document.createElement('div');
                        kunciEl.className = 'huruf-terkunci';
                        kunciEl.innerText = huruf;
                        target.appendChild(kunciEl);
                        
                        urutanSaatIni++;
                        
                        if (urutanSaatIni === kataKunci.length) {
                            setTimeout(() => {
                                document.getElementById('intro-screen').style.display = 'none';
                                document.getElementById('main-screen').style.display = 'block';
                            }, 500);
                        }
                    } else {
                        // Efek salah (getar)
                        el.style.transform = 'translate(10px, 0)';
                        setTimeout(() => el.style.transform = 'translate(0, 0)', 100);
                    }
                };
                area.appendChild(el);
            });
        }

        window.onload = inisialisasiIntro;

        /* === 3. DATA KATEGORI (3 Kolom -> 3 Kolom) === */
        // Data ini menggunakan placeholder gambar/video agar aman dan langsung jalan
        const dataPortofolio = {

                { nama: "Fotografi Ai", cover: "https://picsum.photos/id/10/400/300", 
                  sub: [
                      { nama: "Cyberpunk City", tipe: "img", url: "https://picsum.photos/id/11/1000/800" },
                      { nama: "Robot Potret", tipe: "img", url: "https://picsum.photos/id/12/1000/800" },
                      { nama: "Alam AI", tipe: "img", url: "https://picsum.photos/id/13/1000/800" }
                  ] 
                },
                { nama: "Fotografi Kamera", cover: "https://picsum.photos/id/14/400/300",
                  sub: [
                      { nama: "Wedding", tipe: "img", url: "https://picsum.photos/id/15/1000/800" },
                      { nama: "Jalanan", tipe: "img", url: "https://picsum.photos/id/16/1000/800" },
                      { nama: "Produk", tipe: "img", url: "https://picsum.photos/id/17/1000/800" }
                  ]
                },
                { nama: "Eksperimen Lensa", cover: "https://picsum.photos/id/18/400/300",
                  sub: [
                      { nama: "Makro", tipe: "img", url: "https://picsum.photos/id/19/1000/800" },
                      { nama: "Fisheye", tipe: "img", url: "https://picsum.photos/id/20/1000/800" },
                      { nama: "Astrophotography", tipe: "img", url: "https://picsum.photos/id/21/1000/800" }
                  ]
                }
            ],
            "Video": [
                { nama: "Film Pendek", cover: "https://picsum.photos/id/22/400/300",
                  sub: [
                      { nama: "Teaser 1", tipe: "video", url: "https://www.w3schools.com/html/mov_bbb.mp4" },
                      { nama: "Teaser 2", tipe: "video", url: "https://www.w3schools.com/html/mov_bbb.mp4" },
                      { nama: "BTS", tipe: "video", url: "https://www.w3schools.com/html/mov_bbb.mp4" }
                  ]
                },
                { nama: "Iklan Komersial", cover: "https://picsum.photos/id/23/400/300",
                  sub: [
                      { nama: "Iklan Sepatu", tipe: "video", url: "https://www.w3schools.com/html/mov_bbb.mp4" },
                      { nama: "Iklan Minuman", tipe: "video", url: "https://www.w3schools.com/html/mov_bbb.mp4" },
                      { nama: "Iklan Mobil", tipe: "video", url: "https://www.w3schools.com/html/mov_bbb.mp4" }
                  ]
                },
                { nama: "Dokumenter", cover: "https://picsum.photos/id/24/400/300",
                  sub: [
                      { nama: "Alam", tipe: "video", url: "https://www.w3schools.com/html/mov_bbb.mp4" },
                      { nama: "Kota", tipe: "video", url: "https://www.w3schools.com/html/mov_bbb.mp4" },
                      { nama: "Budaya", tipe: "video", url: "https://www.w3schools.com/html/mov_bbb.mp4" }
                  ]
                }
            ],
            "Desain": [
                 { nama: "Desain Logo", cover: "https://picsum.photos/id/25/400/300",

                  sub: [

                  ]
                },
                { nama: "Brosur & Majalah", cover: "https://picsum.photos/id/33/400/300",
                  sub: [
                      { nama: "Katalog PDF", tipe: "pdf", url: "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf" },
                      { nama: "Flyer Event", tipe: "img", url: "https://picsum.photos/id/34/1000/800" },

                  ]
                }
            ],
            "3Ddesain": [
                 { nama: "Karakter 3D", cover: "https://picsum.photos/id/35/400/300",
                  sub: [
                      { nama: "Hero Utama", tipe: "img", url: "https://picsum.photos/id/36/1000/800" },
                      { nama: "Monster", tipe: "img", url: "https://picsum.photos/id/37/1000/800" },
                      { nama: "NPC", tipe: "img", url: "https://picsum.photos/id/38/1000/800" }
                  ]
                },
                { nama: "Lingkungan 3D", cover: "https://picsum.photos/id/39/400/300",
                  sub: [
                      { nama: "Hutan Tropis", tipe: "img", url: "https://picsum.photos/id/40/1000/800" },
                      { nama: "Ruang Angkasa", tipe: "img", url: "https://picsum.photos/id/41/1000/800" },
                      { nama: "Kota Masa Depan", tipe: "img", url: "https://picsum.photos/id/42/1000/800" }
                  ]
                },
                { nama: "Aset Game", cover: "https://picsum.photos/id/43/400/300",
                  sub: [
                      { nama: "Senjata", tipe: "img", url: "https://picsum.photos/id/44/1000/800" },
                      { nama: "Kendaraan", tipe: "img", url: "https://picsum.photos/id/45/1000/800" },
                      { nama: "Properti Rumah", tipe: "img", url: "https://picsum.photos/id/46/1000/800" }
                  ]
                }
            ]
        };

        let kategoriAktif = "";

        // Tampilkan 3 Kolom Level 1
        function loadKategori(namaKategori) {
            kategoriAktif = namaKategori;
            document.getElementById('judul-seksi').innerText = namaKategori;
            document.getElementById('btn-kembali').style.display = 'none';
            
            const grid = document.getElementById('konten-grid');
            grid.innerHTML = ""; // Bersihkan isi

            const items = dataPortofolio[namaKategori];
            if(!items) return;

            items.forEach((item, index) => {
                let card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${item.cover}" alt="${item.nama}">
                    <h3 class="retro-text">${item.nama}</h3>
                `;
                card.onclick = () => loadSubKategori(namaKategori, index);
                grid.appendChild(card);
            });
        }

        // Tampilkan 3 Kolom Level 2 (Isi Media)
        function loadSubKategori(namaKategori, indexLevel1) {
            const subItems = dataPortofolio[namaKategori][indexLevel1].sub;
            document.getElementById('judul-seksi').innerText = dataPortofolio[namaKategori][indexLevel1].nama;
            document.getElementById('btn-kembali').style.display = 'inline-block';
            
            const grid = document.getElementById('konten-grid');
            grid.innerHTML = "";

            subItems.forEach((sub) => {
                let card = document.createElement('div');
                card.className = 'card';
                
                // Jika video atau PDF, covernya pakai gambar dummy dengan icon
                let coverImg = "https://picsum.photos/seed/"+sub.nama+"/400/300"; 
                
                card.innerHTML = `
                    <img src="${coverImg}" alt="${sub.nama}">
                    <h3 class="retro-text">${sub.nama}</h3>
                    <p style="margin-top:10px; font-weight:bold;">Tipe: ${sub.tipe.toUpperCase()}</p>
                `;
                
                card.onclick = () => bukaMedia(sub.tipe, sub.url);
                grid.appendChild(card);
            });
        }

        function kembaliKeKategoriUtama() {
            loadKategori(kategoriAktif);
        }

        /* === 4. MEDIA VIEWER (LIGHTBOX) === */
        function bukaMedia(tipe, url) {
            const lightbox = document.getElementById('lightbox');
            const konten = document.getElementById('lightbox-content');
            konten.innerHTML = ""; // Bersihkan

            if (tipe === 'img') {
                konten.innerHTML = `<img src="${url}" alt="Gambar Penuh">`;
            } else if (tipe === 'video') {
                konten.innerHTML = `<video controls autoplay><source src="${url}" type="video/mp4">Browser tidak support video.</video>`;
            } else if (tipe === 'pdf') {
                konten.innerHTML = `<iframe src="${url}"></iframe>`;
            }

            lightbox.style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
            document.getElementById('lightbox-content').innerHTML = ""; // Matikan video/audio
        }

        /* === 5. TOGGLE MEDIA SOSIAL === */
        function toggleSosmed() {
            const popup = document.getElementById('sosmed-popup');
            if (popup.style.display === 'flex') {
                popup.style.display = 'none';
            } else {
                popup.style.display = 'flex';
            }
        }
    </script>
</body>
</html>
